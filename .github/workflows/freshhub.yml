name: freshhub

on:
  push:
    paths:
      - "freshhub/**"
      - "tests/**"
      - "pyproject.toml"
      - "alembic.ini"
      - ".github/workflows/freshhub.yml"
  pull_request:
    paths:
      - "freshhub/**"
      - "tests/**"
      - "pyproject.toml"
      - "alembic.ini"
      - ".github/workflows/freshhub.yml"

jobs:
  qualidade:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"   # mesma versao da VPS
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m ruff check freshhub tests
      - run: python -m mypy
      - run: lint-imports
      # --skip-editable: o proprio freshhub (instalado com -e) nao esta no PyPI;
      # vulnerabilidade em dependencia ainda devolve exit 1
      - run: python -m pip_audit --skip-editable --progress-spinner off

  testes:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: freshhub
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: freshhub_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U freshhub -d freshhub_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      FH_TEST_DATABASE_URL: postgresql+psycopg://freshhub:ci@127.0.0.1:5432/freshhub_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
