{# Botão "Colunas" das tabelas do portal. Incluído por _envios.html (Envios e Entradas) e cotacao.html. #}
<script>
// Botão "Colunas" (o mesmo do acompanhamento) pras tabelas cujo cabeçalho é fixo no HTML:
// escolher quais colunas aparecem e em que ordem. Vale por título de coluna e fica salvo no navegador.
// Retorna "aplicar": chamar depois de cada redesenho do tbody.
window.seletorColunasPortal = function (tb, col) {
  const ths0 = [...tb.querySelectorAll('thead th')];
  const nomes = ths0.map(th => th.firstChild.textContent.trim());
  ths0.forEach((th, i) => { th.dataset.i = i; });
  const CHAVE = 'portal_colunas_' + tb.id + '_v1';
  let visiveis = nomes.slice();
  try {
    const salvo = JSON.parse(localStorage.getItem(CHAVE) || 'null');
    if (Array.isArray(salvo) && salvo.length && salvo.every(n => nomes.includes(n))) visiveis = salvo;
  } catch (e) {}
  const salvar = () => { try { localStorage.setItem(CHAVE, JSON.stringify(visiveis)); } catch (e) {} };
  const aplicar = () => {
    const ordem = visiveis.map(n => nomes.indexOf(n));
    const resto = nomes.map((_, i) => i).filter(i => !ordem.includes(i));
    tb.querySelectorAll('tr').forEach(tr => {
      const cels = [...tr.children];
      if (cels.length === 1) { cels[0].colSpan = ordem.length; return; }   // linha de detalhe
      if (cels.length !== nomes.length) return;
      const porI = {};
      cels.forEach((c, k) => { if (c.dataset.i == null) c.dataset.i = k; porI[c.dataset.i] = c; });
      ordem.concat(resto).forEach(i => { porI[i].hidden = !ordem.includes(i); tr.appendChild(porI[i]); });
    });
    if (col && col.aplicarLarg && tb.classList.contains('fixa')) col.aplicarLarg();
  };
  const CIMA = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"></polyline></svg>';
  const BAIXO = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="6 9 12 15 18 9"></polyline></svg>';
  const ferr = tb.closest('.card-tabela').querySelector('.ferramentas');
  ferr.insertAdjacentHTML('beforeend', `
    <button type="button" class="botao-linha" data-btn-colunas>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"></rect><line x1="9" y1="3" x2="9" y2="21"></line><line x1="15" y1="3" x2="15" y2="21"></line></svg>
      <span>Colunas</span>
    </button>
    <div class="popover" data-pop-colunas>
      <div class="cabeca"><b>Colunas da tabela</b><span>use as setas pra reordenar</span></div>
      <div class="grupo" data-vis></div>
      <div class="grupo" data-disp></div>
      <div class="pe"><a data-padrao>Restaurar padrão</a><button type="button" class="botao" data-fechar style="padding: 7px 14px; font-size: 12px;">Fechar</button></div>
    </div>`);
  const btn = ferr.querySelector('[data-btn-colunas]'), pop = ferr.querySelector('[data-pop-colunas]');
  const nome = n => String(n).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const desenhar = () => {
    pop.querySelector('[data-vis]').innerHTML = `<div class="rot">Visíveis (${visiveis.length})</div>` + visiveis.map((n, i) =>
      `<div class="item"><label><input type="checkbox" checked data-col="${nome(n)}"><span>${nome(n)}</span></label>
        <span class="mover"><button type="button" data-mover="${nome(n)}" data-dir="-1" ${i === 0 ? 'disabled' : ''} title="Subir">${CIMA}</button><button type="button" data-mover="${nome(n)}" data-dir="1" ${i === visiveis.length - 1 ? 'disabled' : ''} title="Descer">${BAIXO}</button></span></div>`).join('');
    const resto = nomes.filter(n => !visiveis.includes(n));
    pop.querySelector('[data-disp]').innerHTML = '<div class="rot">Disponíveis</div>' + (resto.length ? resto.map(n => `<div class="item disponivel"><label><input type="checkbox" data-col="${nome(n)}"><span>${nome(n)}</span></label></div>`).join('') : '<div class="item disponivel">Todas as colunas estão visíveis.</div>');
  };
  const abrir = ab => { pop.classList.toggle('aberto', ab); btn.classList.toggle('ativo', ab); if (ab) desenhar(); };
  const mudou = () => { salvar(); desenhar(); aplicar(); };
  btn.addEventListener('click', () => abrir(!pop.classList.contains('aberto')));
  pop.querySelector('[data-fechar]').addEventListener('click', () => abrir(false));
  pop.querySelector('[data-padrao]').addEventListener('click', () => { visiveis = nomes.slice(); mudou(); });
  document.addEventListener('click', e => {
    const caminho = e.composedPath();   // o clique no popover re-renderiza: e.target já pode estar fora do DOM
    if (!caminho.includes(pop) && !caminho.includes(btn)) abrir(false);
  });
  pop.addEventListener('change', e => {
    const n = e.target.dataset.col;
    if (n == null) return;
    if (e.target.checked) { if (!visiveis.includes(n)) visiveis.push(n); }
    else { if (visiveis.length <= 1) { e.target.checked = true; return; } visiveis = visiveis.filter(x => x !== n); }
    mudou();
  });
  pop.addEventListener('click', e => {
    const b = e.target.closest('[data-mover]');
    if (!b) return;
    const i = visiveis.indexOf(b.dataset.mover), j = i + Number(b.dataset.dir);
    if (i < 0 || j < 0 || j >= visiveis.length) return;
    [visiveis[i], visiveis[j]] = [visiveis[j], visiveis[i]];
    mudou();
  });
  aplicar();
  return aplicar;
};
</script>
