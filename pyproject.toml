[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "freshhub"
version = "0.1.0"
description = "Sistema proprio da Fresh Log: pedidos, armazem, transporte, financeiro"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "alembic>=1.13,<2",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "httpx>=0.27",
  "ruff>=0.6",
  "mypy>=1.11",
  "import-linter>=2.0",
  "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["freshhub*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -p no:cacheprovider"

[tool.ruff]
target-version = "py311"
line-length = 110
src = ["freshhub", "tests"]
# So o pacote novo e os testes novos passam pelo lint; o legado fica fora.
include = ["freshhub/**/*.py", "tests/**/*.py", "pyproject.toml"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "S", "T20"]
ignore = ["S101", "N818"]  # S101: assert e normal em teste; N818: excecoes com nome em portugues

[tool.ruff.lint.isort]
known-first-party = ["freshhub"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S607"]  # senhas de mentira e `git` por caminho parcial em teste

[tool.mypy]
python_version = "3.11"
strict = true
files = ["freshhub"]
plugins = ["pydantic.mypy"]

[tool.importlinter]
root_package = "freshhub"

[[tool.importlinter.contracts]]
name = "dominio nao depende de nada do pacote"
type = "forbidden"
source_modules = ["freshhub.dominio"]
forbidden_modules = ["freshhub.servicos", "freshhub.modelos", "freshhub.adaptadores", "freshhub.api", "freshhub.jobs", "freshhub.config"]

[[tool.importlinter.contracts]]
name = "camadas: api e jobs so chamam servicos"
type = "layers"
layers = ["freshhub.api | freshhub.jobs", "freshhub.servicos", "freshhub.dominio"]

[[tool.importlinter.contracts]]
name = "api e jobs nao falam direto com modelos nem adaptadores"
type = "forbidden"
source_modules = ["freshhub.api", "freshhub.jobs"]
forbidden_modules = ["freshhub.modelos", "freshhub.adaptadores"]
ignore_imports = ["freshhub.api.saude -> freshhub.modelos.sessao"]
