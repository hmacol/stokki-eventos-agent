<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <!-- PWA (iPhone): servido em app.freshhub.com.br/motorista/web (experiments.baseUrl no app.json). -->
    <link rel="manifest" href="/motorista/web/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/motorista/web/apple-touch-icon.png" />
    <meta name="theme-color" content="#141428" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="FreshLog" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <meta name="format-detection" content="telephone=no" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      /* Sem rolagem no body: as telas usam ScrollView */
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <noscript>
      Ative o JavaScript para usar o app FreshLog Motorista.
    </noscript>
    <div id="root"></div>
    <script>
      // Service worker: deixa o app abrir sem sinal (a fila de envios já funciona offline).
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('/motorista/web/sw.js', { scope: '/motorista/web/' }).catch(function () {});
          // Na 1ª visita os arquivos carregam antes do service worker assumir:
          // manda a lista pra ele guardar (senão o 2º acesso sem sinal não abre).
          var guardar = function () {
            navigator.serviceWorker.ready.then(function (reg) {
              var urls = performance.getEntriesByType('resource').map(function (r) { return r.name; });
              if (reg.active) reg.active.postMessage({ tipo: 'guardar', urls: urls });
            });
          };
          setTimeout(guardar, 3000);
          setTimeout(guardar, 15000);
        });
      }
    </script>
  </body>
</html>
