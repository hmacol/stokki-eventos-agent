{# JS do filtro por embarcador da Torre, incluído DENTRO do <script> de
   torre_controle.html e torre_mobile.html (as duas definem renderMapa,
   renderRotas, renderPedidosStatus, renderExcecoes, esc, dadosAtuais e
   idsSelecionados). Precisa de #filtro-embarcador e #aviso-filtro. #}
// ── Filtro por embarcador (Hugo, 05/10: "ver somente os pedidos da
// MARCHEF") -- filtra no navegador o que já veio de /api/torre/dados
// (cada pedido traz o sender_id da Vuupt), sem pedir outra coleta ao
// backend. Vale pra rotas, mapa, "Pedidos das rotas abertas" e Fila de
// ação; KPIs, tendência, Stokki e amanhã continuam da operação toda.
let filtroEmbarcador = "";
try { filtroEmbarcador = localStorage.getItem("torre_filtro_embarcador") || ""; } catch (e) {}

function opcaoFiltroAtual(d) {
  if (!filtroEmbarcador || !d) return null;
  return (d.embarcadores || []).find(o => o.chave === filtroEmbarcador) || null;
}

function alternarFiltroEmbarcador(valor) {
  filtroEmbarcador = valor !== undefined ? valor : document.getElementById("filtro-embarcador").value;
  try { localStorage.setItem("torre_filtro_embarcador", filtroEmbarcador); } catch (e) {}
  idsSelecionados.clear();
  if (dadosAtuais) renderVisaoFiltrada();
}

// Só entram no seletor os embarcadores com pedido na torre agora (mais o
// escolhido, mesmo que tenha zerado -- senão o filtro sumiria sozinho).
function renderSeletorEmbarcador(d) {
  const el = document.getElementById("filtro-embarcador");
  const qtd = {};
  const conta = sid => { if (sid != null) qtd[sid] = (qtd[sid] || 0) + 1; };
  d.rotas.forEach(r => (r.pedidos || []).forEach(p => { if (p.situacao !== "excluido") conta(p.sender_id); }));
  Object.entries(d.pedidos.atrasados_por_sender || {}).forEach(([sid, n]) => { qtd[sid] = (qtd[sid] || 0) + n; });
  const opcoes = (d.embarcadores || [])
    .map(o => ({ ...o, n: o.sender_ids.reduce((s, sid) => s + (qtd[sid] || 0), 0) }))
    .filter(o => o.n > 0 || o.chave === filtroEmbarcador);
  el.innerHTML = `<option value="">Todos os embarcadores</option>` + opcoes.map(o =>
    `<option value="${esc(o.chave)}">${o.grupo ? "" : "  "}${esc(o.rotulo)} · ${o.n}</option>`).join("");
  el.value = opcoes.some(o => o.chave === filtroEmbarcador) ? filtroEmbarcador : "";
  el.classList.toggle("ativo", !!el.value);
}

// Cópia de `d` só com os pedidos do embarcador escolhido. Rota entra se
// tiver ao menos 1 pedido dele; os números da rota são refeitos só com
// esses pedidos. Chip "excluido" não tem remetente e sai do filtro.
function filtrarPorEmbarcador(d, opcao) {
  const ids = new Set(opcao.sender_ids.map(String));
  const doEmb = x => x.sender_id != null && ids.has(String(x.sender_id));
  const idsFila = new Set(d.excecoes.map(x => x.id));
  const cont = { sucesso: 0, falha: 0, on_route: 0, accepted: 0 };

  const rotas = d.rotas.map(r => {
    const pedidos = (r.pedidos || []).filter(doEmb);
    if (!pedidos.length) return null;
    const n = s => pedidos.filter(p => p.situacao === s).length;
    const entregues = n("entregue"), insucessos = n("insucesso"), emRota = n("em_rota");
    const total = pedidos.length, finalizados = entregues + insucessos;
    cont.sucesso += entregues; cont.falha += insucessos;
    cont.on_route += emRota; cont.accepted += n("pendente");
    const estado = finalizados >= total ? "concluida"
      : (finalizados > 0 || emRota > 0) ? "em_andamento" : "nao_iniciada";
    return {
      ...r, pedidos, total, entregues, insucessos, estado,
      paradas: (r.paradas || []).filter(doEmb),
      restantes: total - finalizados,
      percentual: Math.round(finalizados / total * 100),
      pendencias: pedidos.filter(p => p.situacao === "insucesso" && idsFila.has(`insucesso:${p.codigo}`)).length,
    };
  }).filter(Boolean);

  const rotaIds = new Set(rotas.map(r => r.id));
  const naFila = x => (x.tipo === "Insucesso" && doEmb(x)) || (x.tipo === "Sem motorista" && rotaIds.has(x.rota_id));
  const excecoes = d.excecoes.filter(naFila);
  const semRota = opcao.sender_ids.reduce((s, sid) => s + ((d.pedidos.atrasados_por_sender || {})[sid] || 0), 0);

  return {
    ...d, rotas, excecoes,
    tratadas: (d.tratadas || []).filter(naFila),
    gerais_ocultas: d.excecoes.filter(x => x.tipo !== "Insucesso" && x.tipo !== "Sem motorista").length,
    pedidos: {
      ...d.pedidos,
      sucesso: cont.sucesso, falha: cont.falha,
      contagem: { on_route: cont.on_route, accepted: cont.accepted, not_assigned: semRota, canceled: 0 },
      backlog_pool: 0, backlog_futuros: 0,
    },
  };
}

function dadosVisiveis() {
  const opcao = opcaoFiltroAtual(dadosAtuais);
  return opcao ? filtrarPorEmbarcador(dadosAtuais, opcao) : dadosAtuais;
}

function renderAvisoFiltro(opcao, v) {
  const el = document.getElementById("aviso-filtro");
  if (!opcao) { el.hidden = true; el.innerHTML = ""; return; }
  const qtdPedidos = v.rotas.reduce((s, r) => s + r.total, 0);
  const gerais = v.gerais_ocultas
    ? ` · ${v.gerais_ocultas} alerta(s) geral(is) da Fila escondido(s) (pipeline, vigia, planejamento)` : "";
  el.innerHTML = `<span>Filtrando: <strong>${esc(opcao.rotulo)}</strong></span>
    <span class="suave">${v.rotas.length} rota(s) · ${qtdPedidos} pedido(s) em rota${gerais}.
      Indicadores, tendência, Stokki e amanhã continuam da operação toda.</span>
    <button type="button" class="botao-refresh" onclick="alternarFiltroEmbarcador('')">Ver todos</button>`;
  el.hidden = false;
}

function renderVisaoFiltrada() {
  const d = dadosAtuais;
  renderSeletorEmbarcador(d);
  const v = dadosVisiveis();
  renderAvisoFiltro(opcaoFiltroAtual(d), v);
  renderMapa(v);
  renderRotas(v);
  renderPedidosStatus(v);
  renderExcecoes(v);
}
