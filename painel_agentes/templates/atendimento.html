{% extends "base.html" %}
{% block titulo %}Atendimento{% endblock %}
{% block estilo_extra %}
<style>
  main { max-width: none; padding: 18px 22px 18px; display: flex; flex-direction: column; gap: 14px; min-height: 100vh; }
  .topo { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .topo h1 { margin: 0; font-size: 19px; font-weight: 800; }
  .topo .sub { font-size: 12px; color: var(--texto-suave); }
  .seg { display: inline-flex; background: var(--fundo); border: 1px solid var(--borda); border-radius: 8px; padding: 3px; gap: 2px; }
  .seg button { font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 6px; border: none; background: transparent; color: var(--texto-suave); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-family: inherit; }
  .seg button.ativo { background: var(--superficie); color: var(--texto); box-shadow: 0 1px 2px rgba(20,20,40,0.08); }
  .seg button.ativo i { width: 8px; height: 8px; border-radius: 100px; background: var(--acento); display: inline-block; }
  .seg button.ativo.ALMOCO i { background: var(--rodando); } .seg button.ativo.OFFLINE i { background: var(--texto-suave); }
  .rot { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.4px; color: var(--texto-suave); }
  .chip-kpi { font-size: 12px; color: var(--texto-suave); background: var(--superficie); border: 1px solid var(--borda); border-radius: 100px; padding: 5px 12px; white-space: nowrap; }
  .chip-kpi b { color: var(--texto); }
  .nome-atd { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--texto-suave); }
  .nome-atd input { border: 1px solid var(--borda); border-radius: 6px; padding: 5px 8px; font-size: 12.5px; width: 120px; background: var(--superficie); color: var(--texto); font-family: inherit; }
  .grade { display: grid; grid-template-columns: 300px minmax(0, 1fr) 300px; gap: 14px; flex: 1; min-height: 0; }
  @media (max-width: 1100px) { .grade { grid-template-columns: 260px minmax(0, 1fr); } .lateral { display: none; } }
  .card { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; display: flex; flex-direction: column; min-height: 0; overflow: hidden; }
  .abas { display: inline-flex; background: var(--fundo); border-radius: 8px; padding: 3px; gap: 2px; flex-wrap: wrap; }
  .abas button { font-size: 12px; font-weight: 600; padding: 5px 10px; border-radius: 6px; border: none; background: transparent; color: var(--texto-suave); cursor: pointer; display: inline-flex; gap: 5px; align-items: center; font-family: inherit; }
  .abas button.ativa { background: var(--superficie); color: var(--texto); box-shadow: 0 1px 2px rgba(20,20,40,0.08); }
  .abas button em { font-style: normal; font-size: 11px; color: var(--texto-suave); }
  .busca { display: flex; align-items: center; gap: 8px; border: 1px solid var(--borda); border-radius: 6px; padding: 5px 10px; }
  .busca input { border: none; background: transparent; font-family: inherit; font-size: 12px; color: var(--texto); width: 100%; outline: none; }
  .fila { overflow-y: auto; flex: 1; }
  .item { display: flex; gap: 9px; padding: 11px 12px 11px 10px; border-left: 3px solid transparent; border-bottom: 1px solid var(--borda); cursor: pointer; }
  .item:hover { background: var(--superficie-hover); }
  .item.ativo { border-left-color: var(--acento); background: var(--superficie-hover); }
  .item .pt { width: 7px; height: 7px; border-radius: 100px; flex: none; margin-top: 6px; background: transparent; }
  .item.nl .pt { background: var(--acento); }
  .item .c { display: flex; flex-direction: column; gap: 4px; min-width: 0; flex: 1; }
  .item .l1 { display: flex; align-items: center; gap: 6px; }
  .item .l1 b { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; }
  .item .l1 .q { font-size: 10.5px; color: var(--texto-suave); white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
  .item .l2 { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .l3 { font-size: 11.5px; color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .item .l4 { display: flex; align-items: center; gap: 8px; font-size: 10.5px; color: var(--texto-suave); }
  .pill { display: inline-flex; align-items: center; gap: 5px; padding: 2px 8px; border-radius: 100px; font-size: 10px; font-weight: 700; letter-spacing: 0.4px; text-transform: uppercase; white-space: nowrap; }
  .pill i { width: 6px; height: 6px; border-radius: 100px; background: currentColor; }
  .pill.AGUARDANDO_FL, .pill.NA_FILA { background: var(--rodando-bg); color: var(--rodando-texto); }
  .pill.RESPONDIDO, .pill.COM_ASSISTENTE { background: var(--teste-bg); color: var(--teste-texto); }
  .pill.EM_ATENDIMENTO { background: var(--sucesso-bg); color: var(--sucesso); }
  .pill.RESOLVIDO { background: var(--interrompido-bg); color: var(--interrompido-texto); }
  .conv-cab { display: flex; flex-direction: column; gap: 8px; padding: 12px 16px; border-bottom: 1px solid var(--borda); }
  .conv-cab h2 { margin: 0; font-size: 15px; font-weight: 700; }
  .conv-cab .meta { display: flex; align-items: center; gap: 12px; font-size: 11.5px; color: var(--texto-suave); flex-wrap: wrap; }
  .conv-cab .meta .acoes { margin-left: auto; display: flex; gap: 6px; align-items: center; }
  .botao-linha { display: inline-flex; align-items: center; gap: 6px; background: none; border: 1px solid var(--borda); border-radius: 6px; padding: 6px 12px; font-size: 12px; color: var(--texto); cursor: pointer; font-family: inherit; white-space: nowrap; }
  .botao-linha:hover { border-color: var(--acento); color: var(--acento); }
  .botao-p { display: inline-flex; align-items: center; gap: 7px; background: var(--primaria); color: #fff; border: 1px solid transparent; padding: 7px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; white-space: nowrap; }
  html.tema-escuro .botao-p { background: var(--acento); color: #0B0E14; }
  .botao-p:disabled, .botao-linha:disabled { opacity: 0.5; cursor: default; }
  .conv-corpo { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 8px; background: var(--fundo); }
  .msg { display: flex; flex-direction: column; align-items: flex-start; gap: 3px; max-width: 84%; }
  .msg.eu { align-items: flex-end; align-self: flex-end; }
  .bolha { background: var(--superficie); border: 1px solid var(--borda); border-radius: 4px 14px 14px 14px; padding: 9px 12px; font-size: 13px; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }
  .msg.eu .bolha { background: var(--primaria); color: #fff; border-color: transparent; border-radius: 14px 14px 4px 14px; }
  html.tema-escuro .msg.eu .bolha { background: #1E3A5F; color: var(--texto); }
  .msg.bot .bolha { border-left: 3px solid var(--teste-texto); }
  .meta-msg { font-size: 10.5px; color: var(--texto-suave); }
  .sistema { align-self: center; font-size: 11px; color: var(--texto-suave); background: var(--superficie); border: 1px solid var(--borda); border-radius: 100px; padding: 4px 12px; text-align: center; }
  .resumo { border: 1px solid var(--borda); border-left: 3px solid var(--teste-texto); border-radius: 8px; padding: 10px 12px; background: var(--superficie); display: flex; flex-direction: column; gap: 5px; font-size: 12px; }
  .resumo .t { display: flex; align-items: center; gap: 6px; color: var(--teste-texto); font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: 0.3px; }
  .anexo { display: inline-flex; align-items: center; gap: 6px; margin-top: 6px; padding: 5px 9px; border-radius: 7px; background: var(--fundo); border: 1px solid var(--borda); color: var(--texto); font-size: 11.5px; text-decoration: none; }
  .msg.eu .anexo { background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.18); color: inherit; }
  .conv-pe { padding: 10px 16px 12px; border-top: 1px solid var(--borda); display: flex; flex-direction: column; gap: 8px; }
  .macros { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .macro { font-size: 11.5px; padding: 4px 9px; border-radius: 100px; border: 1px solid var(--borda); color: var(--texto); background: none; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .macro:hover { border-color: var(--acento); color: var(--acento); }
  .compor { display: flex; align-items: flex-end; gap: 8px; }
  .compor textarea { flex: 1; border: 1px solid var(--borda); border-radius: 8px; padding: 9px 11px; font-size: 13px; font-family: inherit; background: var(--superficie); color: var(--texto); resize: none; min-height: 38px; max-height: 140px; outline: none; }
  .compor textarea:focus { border-color: var(--acento); }
  .compor .ico { background: none; border: none; color: var(--texto-suave); cursor: pointer; padding: 8px 4px; display: flex; }
  .nota { font-size: 11px; color: var(--texto-suave); }
  .pendentes { display: flex; flex-wrap: wrap; gap: 6px; }
  .pendentes span { font-size: 11px; padding: 3px 8px; border-radius: 6px; background: var(--fundo); border: 1px solid var(--borda); }
  .pendentes span b { cursor: pointer; color: var(--texto-suave); margin-left: 4px; }
  .lateral { display: flex; flex-direction: column; gap: 12px; min-height: 0; overflow-y: auto; }
  .lateral .card { padding: 14px 16px; gap: 8px; overflow: visible; flex: none; }
  .kv { display: flex; justify-content: space-between; gap: 10px; font-size: 12px; }
  .kv span:first-child { color: var(--texto-suave); } .kv span:last-child { font-weight: 600; text-align: right; }
  .vazio { padding: 28px 18px; color: var(--texto-suave); text-align: center; font-size: 13px; }
  .oculto { display: none !important; }
  .mono { font-family: 'Cascadia Code', Consolas, monospace; }
  .aviso-topo { display: none; align-items: center; gap: 8px; font-size: 12px; padding: 8px 12px; border-radius: 8px; background: var(--rodando-bg); color: var(--rodando-texto); border: 1px solid var(--rodando-borda); }
  .aviso-topo.mostrar { display: flex; }
</style>
{% endblock %}

{% block conteudo %}
<div class="topo">
  <div><h1>Atendimento</h1><div class="sub">Chat do portal do cliente e chamados por e-mail, numa fila só.</div></div>
  <div style="display:flex; align-items:center; gap:10px; margin-left:12px; flex-wrap:wrap;">
    <span class="rot">Meu status</span>
    <div class="seg" id="seg-status">
      <button type="button" data-st="ONLINE"><i></i>Online</button>
      <button type="button" data-st="ALMOCO"><i></i>Almoço</button>
      <button type="button" data-st="OFFLINE"><i></i>Offline</button>
    </div>
    <label class="nome-atd">Atendente <input id="nome-atd" placeholder="seu nome" maxlength="60"></label>
    <span class="sub" id="horario-txt"></span>
  </div>
  <div style="margin-left:auto; display:flex; gap:8px; flex-wrap:wrap;" id="kpis"></div>
</div>
<div class="aviso-topo" id="aviso-topo"></div>

<div class="grade">
  <section class="card">
    <div style="padding:10px 12px; border-bottom:1px solid var(--borda); display:flex; flex-direction:column; gap:8px;">
      <div class="abas" id="abas"></div>
      <div class="busca"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:13px;height:13px;color:var(--texto-suave)"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg><input id="busca" placeholder="Cliente, pedido, NF ou nº do chamado"></div>
    </div>
    <div class="fila" id="fila"></div>
  </section>

  <section class="card" id="conversa">
    <div class="vazio" id="conv-vazio">Escolha um chamado na fila.</div>
    <div class="conv-cab oculto" id="conv-cab"></div>
    <div class="conv-corpo oculto" id="conv-corpo"></div>
    <div class="conv-pe oculto" id="conv-pe">
      <div class="macros" id="macros"></div>
      <div class="pendentes oculto" id="pendentes"></div>
      <div class="compor">
        <button type="button" class="ico" id="anexar" title="Anexar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg></button>
        <input type="file" id="arquivos" multiple class="oculto" accept=".jpg,.jpeg,.png,.gif,.webp,.pdf,.xlsx,.xls,.csv,.txt,.xml">
        <textarea id="texto" rows="1" placeholder="Responder ao cliente…"></textarea>
        <button type="button" class="botao-p" id="enviar">Enviar</button>
      </div>
      <div class="nota" id="nota-pe"></div>
    </div>
  </section>

  <aside class="lateral" id="lateral"><div class="vazio">Contexto do cliente aparece aqui.</div></aside>
</div>
<script>
(function () {
  const BOOT = {{ boot | tojson }};
  const BASE = {{ request.script_root | tojson }};
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const ICO_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>';
  const ICO_MAIL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:11px;height:11px"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"></path><polyline points="22,6 12,13 2,6"></polyline></svg>';
  const ICO_BOT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="width:13px;height:13px"><rect x="3" y="8" width="18" height="12" rx="3"></rect><circle cx="9" cy="14" r="1.5"></circle><circle cx="15" cy="14" r="1.5"></circle><line x1="12" y1="4" x2="12" y2="8"></line></svg>';
  const st = { aba: 'fila', fila: [], contagens: BOOT.contagens, meuStatus: BOOT.status, nome: BOOT.nome, chamado: null, mensagens: [], contexto: null,
               ultimoId: 0, busca: '', timerFila: null, timerConv: null, arquivos: [], enviando: false, situacao: BOOT.situacao };

  async function api(caminho, opts) {
    const r = await fetch(BASE + caminho, Object.assign({ credentials: 'same-origin' }, opts || {}));
    if (r.status === 401) { location.href = `${BASE}/login?proximo=${encodeURIComponent(location.pathname)}`; throw new Error('sessão'); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.erro || 'Falha na conexão.');
    return j;
  }

  // ── status / topo ─────────────────────────────────────────────────────────
  function renderTopo() {
    document.querySelectorAll('#seg-status button').forEach(b => { b.className = (b.dataset.st === st.meuStatus ? 'ativo ' + st.meuStatus : ''); });
    $('nome-atd').value = st.nome || '';
    $('horario-txt').textContent = `Horário divulgado ao cliente: ${BOOT.horario} · fora disso o portal sugere deixar chamado`;
    const c = st.contagens || {};
    $('kpis').innerHTML = `<span class="chip-kpi"><b>${c.na_fila || 0}</b> na fila</span><span class="chip-kpi"><b>${c.em_atendimento || 0}</b> em atendimento</span>` +
      `<span class="chip-kpi"><b>${c.email || 0}</b> por e-mail</span><span class="chip-kpi">assistente resolveu <b>${c.assistente_resolveu_hoje || 0}</b> hoje</span>`;
    const av = $('aviso-topo');
    if (st.meuStatus !== 'ONLINE') { av.textContent = st.meuStatus === 'ALMOCO' ? 'Você está em almoço: o portal mostra o cliente como fora do atendimento e sugere deixar chamado.' : 'Você está offline: novas conversas viram chamado por e-mail até alguém ficar online.'; av.classList.add('mostrar'); }
    else if (st.situacao && !st.situacao.dentro_horario) { av.textContent = `Fora do horário divulgado (${BOOT.horario}). Mesmo online, o portal avisa o cliente do horário.`; av.classList.add('mostrar'); }
    else av.classList.remove('mostrar');
  }
  async function mudarStatus(status) {
    const nome = $('nome-atd').value.trim();
    if (status === 'ONLINE' && !nome) { alert('Informe seu nome antes de ficar online -- ele aparece pro cliente.'); $('nome-atd').focus(); return; }
    try { const j = await api('/api/atendimento/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status, nome }) }); st.meuStatus = j.status; st.nome = j.nome; st.situacao = j.situacao; renderTopo(); }
    catch (e) { alert(e.message); }
  }
  $('seg-status').addEventListener('click', e => { const b = e.target.closest('[data-st]'); if (b) mudarStatus(b.dataset.st); });
  $('nome-atd').addEventListener('change', () => { if (st.meuStatus !== 'OFFLINE') mudarStatus(st.meuStatus); });

  // ── fila ──────────────────────────────────────────────────────────────────
  async function carregarFila() {
    try {
      const j = await api(`/api/atendimento/fila?aba=${st.aba}`);
      st.fila = j.chamados; st.contagens = j.contagens; st.situacao = j.situacao; st.meuStatus = j.meu_status; st.nome = j.nome || st.nome;
      renderFila(); renderTopo();
    } catch (e) {}
    clearTimeout(st.timerFila); st.timerFila = setTimeout(carregarFila, 8000);
  }
  function renderFila() {
    const c = st.contagens || {};
    const abas = [['fila', 'Fila', c.fila], ['meus', 'Meus', c.meus], ['email', 'Por e-mail', c.email], ['assistente', 'Com o assistente', c.assistente], ['resolvidos', 'Resolvidos', c.resolvidos]];
    $('abas').innerHTML = abas.map(([id, r, n]) => `<button type="button" class="${st.aba === id ? 'ativa' : ''}" data-aba="${id}">${r} <em>${n || 0}</em></button>`).join('');
    const q = st.busca.trim().toLowerCase();
    let lista = st.fila;
    if (q) lista = lista.filter(x => [x.id, x.nome_cliente, x.assunto, x.pedido_ref, x.cnpj_embarcador].join(' ').toLowerCase().includes(q));
    $('fila').innerHTML = lista.length ? lista.map(x => `
      <div class="item ${st.chamado && st.chamado.id === x.id ? 'ativo' : ''} ${x.nao_lidas ? 'nl' : ''}" data-id="${x.id}"><span class="pt"></span><div class="c">
        <div class="l1"><b>${esc(x.nome_cliente || x.cnpj_embarcador)}</b><span class="q">${x.origem === 'chat' ? ICO_CHAT : ICO_MAIL}${esc(x.status === 'NA_FILA' ? 'esperando ' + (x.espera || '') : x.quando)}</span></div>
        <div class="l2">#${x.id} · ${esc(x.assunto || x.area_rotulo || 'Conversa com o assistente')}</div>
        <div class="l3">${esc(x.resumo_assistente ? 'Assistente: ' + x.resumo_assistente : previa(x))}</div>
        <div class="l4"><span class="pill ${x.status}"><i></i>${esc(x.status_rotulo)}</span><span>${esc(x.area_rotulo || '')}</span>${x.atendente ? `<span>· ${esc(x.atendente)}</span>` : ''}</div>
      </div></div>`).join('') : '<div class="vazio">Nada por aqui.</div>';
  }
  function previa(x) { const quem = x.ultima_origem_msg === 'cliente' ? 'Cliente: ' : (x.ultima_origem_msg === 'equipe' ? 'Fresh Log: ' : ''); return quem + (x.ultima_texto || '').replace(/\s+/g, ' '); }
  $('abas').addEventListener('click', e => { const b = e.target.closest('[data-aba]'); if (!b) return; st.aba = b.dataset.aba; carregarFila(); });
  $('busca').addEventListener('input', e => { st.busca = e.target.value; renderFila(); });
  $('fila').addEventListener('click', e => { const it = e.target.closest('[data-id]'); if (it) abrir(Number(it.dataset.id)); });

  // ── conversa ──────────────────────────────────────────────────────────────
  async function abrir(id) {
    try {
      const j = await api(`/api/atendimento/chamados/${id}`);
      st.chamado = j.chamado; st.mensagens = j.mensagens; st.contexto = j.contexto; st.ultimoId = st.mensagens.length ? st.mensagens[st.mensagens.length - 1].id : 0;
      history.replaceState(null, '', `${location.pathname}?chamado=${id}`);
      renderConversa(); renderLateral(); renderFila(); agendarConv();
    } catch (e) { alert(e.message); }
  }
  async function pollConv() {
    if (!st.chamado) return;
    try {
      const j = await api(`/api/atendimento/chamados/${st.chamado.id}?desde=${st.ultimoId}`);
      const mudou = j.chamado.status !== st.chamado.status || j.chamado.atendente !== st.chamado.atendente;
      st.chamado = j.chamado;
      if (j.mensagens.length) { st.mensagens = st.mensagens.concat(j.mensagens); st.ultimoId = st.mensagens[st.mensagens.length - 1].id; }
      if (j.mensagens.length || mudou) renderConversa();
      $('nota-pe').textContent = notaPe(j.cliente_online);
    } catch (e) {}
    agendarConv();
  }
  function agendarConv() { clearTimeout(st.timerConv); if (st.chamado) st.timerConv = setTimeout(pollConv, st.chamado.status === 'EM_ATENDIMENTO' || st.chamado.status === 'NA_FILA' ? 3000 : 10000); }
  function notaPe(clienteOnline) {
    const c = st.chamado; const mail = (st.contexto && st.contexto.cliente.emails[0]) || 'o e-mail do cliente';
    if (c.status === 'RESOLVIDO') return 'Chamado resolvido. Responder aqui reabre o chamado e avisa o cliente por e-mail.';
    if (c.status === 'EM_ATENDIMENTO' && clienteOnline) return 'Cliente está com o chat aberto agora. Se ele fechar o portal, a resposta vai pro e-mail dele e fica no chamado.';
    return `Cliente não está no chat: a resposta vai pra ${mail} e fica no chamado.`;
  }
  function renderConversa() {
    const c = st.chamado;
    $('conv-vazio').classList.add('oculto'); ['conv-cab', 'conv-corpo', 'conv-pe'].forEach(id => $(id).classList.remove('oculto'));
    const meu = c.atendente === BOOT.usuario;
    let acoes = '';
    if (c.status === 'RESOLVIDO') acoes = `<button type="button" class="botao-linha" data-acao="reabrir">Reabrir</button>`;
    else {
      if (c.status !== 'EM_ATENDIMENTO' || !meu) acoes += `<button type="button" class="botao-linha" data-acao="assumir">Assumir</button>`;
      if (c.status === 'EM_ATENDIMENTO' && meu) acoes += `<button type="button" class="botao-linha" data-acao="transferir">Devolver pra fila</button>`;
      acoes += `<button type="button" class="botao-p" data-acao="resolver">✓ Resolver e enviar histórico</button>`;
    }
    $('conv-cab').innerHTML = `
      <div style="display:flex; align-items:center; gap:9px; flex-wrap:wrap;"><span class="mono" style="font-size:12.5px;color:var(--texto-suave);font-weight:600">#${c.id}</span><h2>${esc(c.assunto || c.area_rotulo || 'Conversa com o assistente')}</h2><span class="pill ${c.status}"><i></i>${esc(c.status_rotulo)}</span></div>
      <div class="meta"><span><b style="color:var(--texto)">${esc(c.nome_cliente || c.cnpj_embarcador)}</b></span><span>${esc(c.area_rotulo || '')}</span>${c.pedido_ref ? `<span>Pedido <b class="mono" style="color:var(--texto)">${esc(c.pedido_ref)}</b></span>` : ''}<span>Aberto ${esc(c.quando)} pelo ${c.origem === 'chat' ? 'chat' : (c.origem === 'email' ? 'e-mail' : 'portal')}</span>${c.atendente ? `<span>Com ${esc(c.atendente)}${c.assumido_em ? ' desde ' + c.assumido_em.slice(11, 16) : ''}</span>` : ''}<span class="acoes">${acoes}</span></div>`;
    const partes = [];
    if (c.resumo_assistente) partes.push(`<div class="resumo"><div class="t">${ICO_BOT}<span>Resumo do assistente</span></div><div><span style="color:var(--texto-suave)">Área:</span> <b>${esc(c.area_rotulo || '-')}</b> &nbsp;·&nbsp; <span style="color:var(--texto-suave)">Pedido:</span> <b class="mono">${esc(c.pedido_ref || '-')}</b></div><div>${esc(c.resumo_assistente)}</div></div>`);
    for (const m of st.mensagens) partes.push(bolha(m));
    $('conv-corpo').innerHTML = partes.join('');
    $('conv-corpo').scrollTop = $('conv-corpo').scrollHeight;
    $('macros').innerHTML = `<span class="rot" style="font-size:10.5px">Respostas rápidas</span>` + BOOT.respostas_rapidas.map(r => `<button type="button" class="macro" data-macro="${esc(r)}">${esc(r.length > 38 ? r.slice(0, 36) + '…' : r)}</button>`).join('');
    $('texto').placeholder = `Responder a ${c.nome_cliente || 'cliente'}…`;
    $('nota-pe').textContent = notaPe(false);
    renderPendentes();
  }
  function bolha(m) {
    const anexos = (m.anexos || []).map(a => `<a class="anexo" href="${BASE}/api/atendimento/chamados/${st.chamado.id}/anexos/${encodeURIComponent(a.arquivo)}" target="_blank" rel="noopener">📎 ${esc(a.nome)}</a>`).join(' ');
    const canal = m.canal === 'email' ? ' · por e-mail' : (m.canal === 'portal' && m.origem === 'cliente' ? ' · pelo portal' : '');
    if (m.origem === 'sistema') return `<div class="sistema">${esc(m.texto)} · ${esc(m.hora)}</div>`;
    if (m.origem === 'equipe') return `<div class="msg eu"><div class="bolha">${esc(m.texto)}${anexos ? '<br>' + anexos : ''}</div><div class="meta-msg">${esc(m.autor || 'Fresh Log')} · ${esc(m.quando)}${canal}</div></div>`;
    if (m.origem === 'assistente') return `<div class="msg bot"><div class="bolha">${esc(m.texto)}</div><div class="meta-msg">Assistente · ${esc(m.hora)}</div></div>`;
    const quem = (m.autor && m.autor !== st.chamado.nome_cliente) ? `${esc(m.autor)} · ${esc(st.chamado.nome_cliente || '')}` : esc(st.chamado.nome_cliente || m.autor || 'Cliente');
    return `<div class="msg"><div class="bolha">${esc(m.texto)}${anexos ? '<br>' + anexos : ''}</div><div class="meta-msg">${quem} · ${esc(m.quando)}${canal}</div></div>`;
  }
  function renderPendentes() { const el = $('pendentes'); el.classList.toggle('oculto', !st.arquivos.length); el.innerHTML = st.arquivos.map((f, i) => `<span>${esc(f.name)}<b data-rm="${i}">×</b></span>`).join(''); }

  async function enviar() {
    const texto = $('texto').value.trim();
    if (!st.chamado || st.enviando || (!texto && !st.arquivos.length)) return;
    if (!st.nome || st.nome === BOOT.usuario) { const n = $('nome-atd').value.trim(); if (!n) { alert('Informe seu nome (aparece pro cliente).'); $('nome-atd').focus(); return; } }
    const fd = new FormData(); fd.append('texto', texto); for (const f of st.arquivos) fd.append('anexos', f, f.name);
    st.enviando = true; $('enviar').disabled = true;
    try {
      const j = await api(`/api/atendimento/chamados/${st.chamado.id}/mensagens`, { method: 'POST', body: fd });
      st.chamado = j.chamado; st.mensagens = st.mensagens.concat(j.mensagens); st.ultimoId = st.mensagens[st.mensagens.length - 1].id;
      $('texto').value = ''; $('texto').style.height = 'auto'; st.arquivos = []; $('arquivos').value = '';
      renderConversa(); carregarFila();
      if (j.email_enviado === 'sem_email') $('nota-pe').textContent = 'Gravado no chamado, mas o cliente não tem e-mail cadastrado (tabela interno).';
      else if (j.email_enviado === 'enviando') $('nota-pe').textContent = 'Gravado no chamado e enviado por e-mail pro cliente.';
    } catch (e) { alert(e.message); }
    st.enviando = false; $('enviar').disabled = false;
  }
  async function acao(tipo) {
    if (!st.chamado) return;
    let corpo = {};
    if (tipo === 'resolver') { const r = prompt('Resolver o chamado e enviar o histórico por e-mail pro cliente.\nResumo da resolução (opcional):', ''); if (r === null) return; corpo = { resolucao: r }; }
    try {
      const j = await api(`/api/atendimento/chamados/${st.chamado.id}/${tipo}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(corpo) });
      st.chamado = j.chamado; st.mensagens = st.mensagens.concat(j.mensagens); if (st.mensagens.length) st.ultimoId = st.mensagens[st.mensagens.length - 1].id;
      renderConversa(); carregarFila();
      if (tipo === 'resolver') $('nota-pe').textContent = j.historico_enviado ? 'Resolvido. Histórico enviado por e-mail pro cliente.' : 'Resolvido, mas o cliente não tem e-mail cadastrado pra receber o histórico.';
    } catch (e) { alert(e.message); }
  }
  $('conv-cab').addEventListener('click', e => { const b = e.target.closest('[data-acao]'); if (b) acao(b.dataset.acao); });
  $('macros').addEventListener('click', e => { const b = e.target.closest('[data-macro]'); if (b) { const t = $('texto'); t.value = (t.value ? t.value + ' ' : '') + b.dataset.macro; t.focus(); } });
  $('enviar').addEventListener('click', enviar);
  $('texto').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); enviar(); } });
  $('texto').addEventListener('input', e => { e.target.style.height = 'auto'; e.target.style.height = Math.min(e.target.scrollHeight, 140) + 'px'; });
  $('anexar').addEventListener('click', () => $('arquivos').click());
  $('arquivos').addEventListener('change', e => { st.arquivos = Array.from(e.target.files || []).slice(0, 5); renderPendentes(); });
  $('pendentes').addEventListener('click', e => { const b = e.target.closest('[data-rm]'); if (b) { st.arquivos.splice(Number(b.dataset.rm), 1); renderPendentes(); } });

  // ── lateral ───────────────────────────────────────────────────────────────
  function renderLateral() {
    const cx = st.contexto; if (!cx) return;
    const cl = cx.cliente, p = cx.pedido, k = cl.kpis;
    const kv = (a, b) => `<div class="kv"><span>${a}</span><span>${b}</span></div>`;
    let html = `<div class="card"><span class="rot">Cliente</span><div style="font-size:14px;font-weight:700">${esc(cl.nome)}</div>${kv('CNPJ', esc(cl.cnpj))}${kv('E-mail', esc(cl.emails.join(', ') || '—'))}${kv('Chamados em 30 dias', `${cl.chamados_30d} · ${cl.resolvidos_30d} resolvidos`)}${k ? kv('Pedidos hoje', `${k.total} · ${k.entregues} entregues`) : ''}</div>`;
    if (p) {
      html += `<div class="card"><span class="rot">Pedido citado</span><div style="display:flex;align-items:center;gap:8px"><span class="mono" style="font-weight:700;font-size:14px">${esc(p.codigo)}</span><span class="pill EM_ATENDIMENTO" style="background:var(--teste-bg);color:var(--teste-texto)"><i></i>${esc(p.situacao_rotulo || '')}</span></div>` +
        kv('NF', esc(p.nf || '—') + (p.volumes ? ` · ${p.volumes} vol.` : '')) + kv('Destinatário', esc(p.destinatario || '—')) + (p.endereco ? kv('Endereço', esc(p.endereco)) : '') +
        kv('Motorista / rota', esc([p.motorista, p.rota].filter(Boolean).join(' · ') || '—')) + (p.ordem ? kv('Parada', `${p.ordem} de ${p.total_paradas}`) : '') + (p.detalhe ? kv('Previsão / conclusão', esc(p.detalhe)) : '') + (p.motivo ? kv('Motivo', esc(p.motivo)) : '') +
        `<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:4px"><a class="botao-linha" href="${BASE}/torre" target="_blank" rel="noopener">Abrir a Torre</a></div></div>`;
    } else if (st.chamado.pedido_ref) html += `<div class="card"><span class="rot">Pedido citado</span><div class="mono" style="font-weight:700">${esc(st.chamado.pedido_ref)}</div><div class="nota">Não achei esse pedido nos dados de hoje do cliente.</div></div>`;
    html += `<div class="card"><span class="rot">Outros chamados deste cliente</span>${cx.outros.length ? cx.outros.map(o => `<div class="kv" style="cursor:pointer" data-id="${o.id}"><span><span class="mono" style="color:var(--texto-suave)">#${o.id}</span> ${esc(o.assunto || '')}</span><span class="pill ${o.status}"><i></i>${esc(o.status_rotulo)}</span></div>`).join('') : '<div class="nota">Nenhum outro chamado.</div>'}</div>`;
    $('lateral').innerHTML = html;
  }
  $('lateral').addEventListener('click', e => { const it = e.target.closest('[data-id]'); if (it) abrir(Number(it.dataset.id)); });

  // ── início ────────────────────────────────────────────────────────────────
  renderTopo(); carregarFila();
  if (BOOT.chamado_inicial) abrir(BOOT.chamado_inicial);
  // heartbeat: mantém o "online" valendo enquanto a tela estiver aberta
  setInterval(() => { if (st.meuStatus !== 'OFFLINE') api('/api/atendimento/status', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ status: st.meuStatus }) }).catch(() => {}); }, 60000);
})();
</script>
{% endblock %}
