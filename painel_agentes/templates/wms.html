<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1">
<meta name="theme-color" content="#141428">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<script>
  (function() {
    var salvo = localStorage.getItem("painel_tema_escuro");
    var escuro = salvo === "1" || (salvo === null && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    if (escuro) document.documentElement.classList.add("tema-escuro");
  })();
</script>
<title>Galpão — Freshlog</title>
<link rel="manifest" href="{{ url_for('wms_manifest') }}">
<link rel="icon" type="image/png" href="{{ url_for('static', filename='favicon.png') }}">
<link rel="apple-touch-icon" href="{{ url_for('static', filename='apple-touch-icon.png') }}">
{% include "_paleta_cores.html" %}
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--fundo); color: var(--texto);
    font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Arial, sans-serif;
    font-size: 15px; line-height: 1.4; overscroll-behavior-y: contain;
  }
  .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, "Roboto Mono", monospace; font-variant-numeric: tabular-nums; }
  .topo {
    position: sticky; top: 0; z-index: 40; background: var(--primaria); color: #fff;
    padding: 10px 14px; padding-top: calc(10px + env(safe-area-inset-top));
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
  }
  .topo .marca { font-weight: 800; font-size: 14px; }
  .topo .sub { font-size: 12px; color: #A3A3C2; }
  .topo .operador { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600; background: rgba(255,255,255,0.08); border: none; color: #fff; padding: 6px 10px; border-radius: 100px; cursor: pointer; }
  .topo .operador .bola { width: 22px; height: 22px; border-radius: 50%; background: var(--acento); color: #06202B; display: grid; place-items: center; font-size: 10px; font-weight: 800; }
  .topo .operador.vazio .bola { background: #E8A33D; }
  .rede { position: relative; padding-left: 14px; font-size: 11px; color: #C7C7E0; white-space: nowrap; }
  .rede::before { content: ""; position: absolute; left: 0; top: 4px; width: 8px; height: 8px; border-radius: 50%; background: #2FD9AE; }
  .rede.off::before { background: #F0AA45; }
  .faixa { background: var(--rodando-bg); color: var(--rodando-texto); border-bottom: 1px solid var(--rodando-borda); padding: 8px 14px; font-size: 13px; font-weight: 600; display: flex; justify-content: space-between; gap: 10px; align-items: center; }
  .faixa[hidden] { display: none; }
  .faixa button { background: none; border: 1px solid currentColor; color: inherit; border-radius: 6px; padding: 4px 8px; font-weight: 700; font-size: 12px; }
  main { max-width: 640px; margin: 0 auto; padding: 12px 14px calc(78px + env(safe-area-inset-bottom)); }
  h1 { margin: 4px 0 2px; font-size: 22px; line-height: 1.1; }
  h1 small { display: block; font-size: 12.5px; color: var(--texto-suave); font-weight: 400; margin-top: 3px; }
  .cartao { background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; padding: 12px 14px; margin: 10px 0; }
  .cartao .rotulo { font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); font-weight: 700; margin-bottom: 4px; }
  .cartao .valor { font-weight: 700; font-size: 16px; }
  .cartao .sub { font-size: 12.5px; color: var(--texto-suave); margin-top: 2px; }
  .cartao.ok { border-left: 4px solid var(--sucesso); }
  .cartao.atencao { border-left: 4px solid var(--rodando); }
  .cartao.erro { border-left: 4px solid var(--erro); }
  .leitura {
    border: 2px dashed var(--acento); background: var(--superficie); border-radius: 12px; padding: 12px; margin: 10px 0;
    display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center;
  }
  .leitura input { width: 100%; font-size: 18px; padding: 10px 12px; border: 1px solid var(--borda); border-radius: 8px; background: var(--fundo); color: var(--texto); font-family: inherit; }
  .leitura input:focus { outline: 2px solid var(--acento); border-color: transparent; }
  .leitura .dica { grid-column: 1 / -1; font-size: 12px; color: var(--texto-suave); text-align: center; }
  .btn-cam { width: 52px; height: 48px; border-radius: 10px; border: none; background: var(--acento); color: #fff; font-size: 22px; cursor: pointer; }
  .acoes { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 10px 0; }
  .acoes button { background: var(--superficie); border: 1px solid var(--borda); border-radius: 12px; padding: 14px 12px; text-align: left; display: grid; gap: 3px; cursor: pointer; color: var(--texto); font-family: inherit; }
  .acoes button b { font-size: 17px; }
  .acoes button span { font-size: 11.5px; color: var(--texto-suave); }
  .acoes button.primario { background: var(--primaria); border-color: var(--primaria); color: #fff; }
  .acoes button.primario span { color: #C7C7E0; }
  .campo { display: grid; gap: 4px; margin: 10px 0; }
  .campo label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--texto-suave); font-weight: 700; }
  .campo input, .campo select, .campo textarea {
    width: 100%; font-size: 17px; padding: 11px 12px; border: 1px solid var(--borda); border-radius: 10px;
    background: var(--superficie); color: var(--texto); font-family: inherit; min-height: 48px;
  }
  .campo input:focus, .campo select:focus, .campo textarea:focus { outline: 2px solid var(--acento); border-color: transparent; }
  .campo input.aguardando { border: 2px dashed var(--acento); }
  .campo .ajuda { font-size: 12px; color: var(--texto-suave); }
  .campo .com-botao { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
  .campo .com-botao button { border-radius: 10px; border: 1px solid var(--borda); background: var(--superficie); color: var(--acento); font-weight: 700; padding: 0 12px; font-size: 13px; cursor: pointer; }
  .duas { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .duas-3 { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
  .lista { display: grid; gap: 6px; margin: 10px 0; }
  .item { background: var(--superficie); border: 1px solid var(--borda); border-radius: 10px; padding: 10px 12px; display: grid; grid-template-columns: 1fr auto; gap: 2px 10px; align-items: center; cursor: pointer; }
  .item .cod { grid-column: 1; grid-row: 1; font-weight: 700; font-size: 15px; }
  .item .meta { grid-column: 1; grid-row: 2; font-size: 12.5px; color: var(--texto-suave); display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .item .qtd { grid-column: 2; grid-row: 1 / span 2; font-size: 22px; font-weight: 800; text-align: right; line-height: 1; }
  .item .qtd small { display: block; font-size: 10.5px; color: var(--texto-suave); font-weight: 600; }
  .item.venc { border-left: 4px solid var(--erro); }
  .item.perto { border-left: 4px solid var(--rodando); }
  .item.escolhido { outline: 2px solid var(--acento); outline-offset: 1px; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 100px; font-size: 10.5px; font-weight: 700; letter-spacing: .3px; text-transform: uppercase; }
  .badge-erro { background: var(--erro-bg); color: var(--erro); }
  .badge-atencao { background: var(--rodando-bg); color: var(--rodando-texto); }
  .badge-ok { background: var(--sucesso-bg); color: var(--sucesso); }
  .badge-neutro { background: var(--interrompido-bg); color: var(--interrompido-texto); }
  .total { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 2px; }
  .total b { font-size: 22px; }
  .total span { font-size: 12.5px; color: var(--texto-suave); }
  .botoes { display: grid; gap: 8px; margin: 12px 0; }
  .botoes.linha { grid-template-columns: 1fr 1fr; }
  button.botao, a.botao {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    background: var(--acento); color: #fff; border: none; min-height: 50px; padding: 10px 16px;
    border-radius: 10px; font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none; font-family: inherit;
  }
  button.botao.secundario, a.botao.secundario { background: transparent; color: var(--acento); border: 1px solid var(--acento); }
  button.botao.neutro { background: var(--superficie); color: var(--texto); border: 1px solid var(--borda); }
  button.botao.perigo { background: var(--erro); }
  button.botao:disabled { opacity: .5; cursor: not-allowed; }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin: 8px 0; }
  .chip { border: 1px solid var(--borda); background: var(--superficie); border-radius: 100px; padding: 6px 12px; font-size: 13px; font-weight: 600; cursor: pointer; color: var(--texto); font-family: inherit; }
  .chip.on { background: var(--texto); color: var(--fundo); border-color: var(--texto); }
  .voltar { background: none; border: none; color: var(--acento); font-weight: 700; font-size: 14px; padding: 6px 0; cursor: pointer; font-family: inherit; }
  .barra-inferior { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: flex; background: var(--superficie); border-top: 1px solid var(--borda); padding-bottom: env(safe-area-inset-bottom); }
  .aba { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 8px 4px 7px; color: var(--texto-suave); background: none; border: none; font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .03em; cursor: pointer; font-family: inherit; }
  .aba .ic { font-size: 19px; line-height: 1; }
  .aba.on { color: var(--acento); }
  .vazio { color: var(--texto-suave); font-size: 13.5px; padding: 14px 4px; text-align: center; }
  .toast { position: fixed; left: 50%; bottom: calc(86px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 60; background: var(--texto); color: var(--fundo); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; max-width: 92vw; box-shadow: 0 6px 20px rgba(0,0,0,.25); opacity: 0; transition: opacity .15s; pointer-events: none; }
  .toast.erro { background: var(--erro); color: #fff; }
  .toast.on { opacity: 1; }
  .modal-cam { position: fixed; inset: 0; z-index: 70; background: #000; display: none; flex-direction: column; }
  .modal-cam.on { display: flex; }
  .modal-cam video { flex: 1; width: 100%; object-fit: cover; }
  .modal-cam .mira { position: absolute; left: 10%; right: 10%; top: 30%; height: 28%; border: 2px solid rgba(255,255,255,.85); border-radius: 12px; box-shadow: 0 0 0 100vmax rgba(0,0,0,.35); pointer-events: none; }
  .modal-cam .rodape-cam { padding: 14px; padding-bottom: calc(14px + env(safe-area-inset-bottom)); display: grid; gap: 8px; background: #000; }
  .modal-cam .rodape-cam p { margin: 0; color: #ccc; font-size: 13px; text-align: center; }
  .pin { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0; }
  .pin button { min-height: 56px; font-size: 22px; font-weight: 700; border-radius: 12px; border: 1px solid var(--borda); background: var(--superficie); color: var(--texto); cursor: pointer; font-family: inherit; }
  .pin-visor { text-align: center; font-size: 30px; letter-spacing: .5em; padding: 10px; min-height: 56px; font-weight: 700; }
  .grade-num { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; }
  .info-linha { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; padding: 4px 0; border-bottom: 1px dashed var(--borda); }
  .info-linha:last-child { border-bottom: none; }
  table.mov { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.mov td { padding: 7px 4px; border-bottom: 1px solid var(--borda); vertical-align: top; }
  .ocupacao { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 6px; }
  .ocupacao .pos { border: 1px solid var(--borda); border-radius: 8px; padding: 8px 6px; text-align: center; font-size: 12px; font-weight: 700; background: var(--superficie); cursor: pointer; }
  .ocupacao .pos.cheia { background: var(--sucesso-bg); border-color: var(--sucesso); }
  .ocupacao .pos small { display: block; font-weight: 400; color: var(--texto-suave); font-size: 10.5px; }
  @media (min-width: 700px) { main { max-width: 760px; } .acoes { grid-template-columns: repeat(3, 1fr); } }
</style>
</head>
<body>
<script>
  const BASE_PATH = "{{ request.script_root }}";
  const BOOT = {{ boot | tojson }};
</script>

<div class="topo">
  <div>
    <div class="marca">Galpão Freshlog</div>
    <div class="sub" id="topo-sub">Endereçamento</div>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <span class="rede" id="rede">online</span>
    <button type="button" class="operador vazio" id="btn-operador"><span class="bola">?</span><span id="operador-nome">ninguém</span></button>
  </div>
</div>
<div class="faixa" id="faixa-fila" hidden><span id="faixa-texto"></span><button type="button" id="btn-reenviar">Reenviar</button></div>

<main id="app"></main>

<nav class="barra-inferior">
  <button class="aba on" data-aba="inicio"><span class="ic">⌂</span>Início</button>
  <button class="aba" data-aba="receber"><span class="ic">⇩</span>Receber</button>
  <button class="aba" data-aba="separar"><span class="ic">☑</span>Separar</button>
  <button class="aba" data-aba="busca"><span class="ic">⌕</span>Consultar</button>
  <button class="aba" data-aba="movimentos"><span class="ic">≡</span>Movimentos</button>
  <button class="aba" data-aba="posicoes"><span class="ic">▦</span>Posições</button>
</nav>

<div class="toast" id="toast"></div>

<div class="modal-cam" id="modal-cam">
  <video id="video" playsinline muted autoplay></video>
  <div class="mira"></div>
  <div class="rodape-cam">
    <p id="cam-status">Aponte para o código de barras ou QR</p>
    <button type="button" class="botao neutro" id="btn-fechar-cam">Fechar câmera</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  const API = BASE_PATH + '/api/wms';
  const app = document.getElementById('app');
  const S = {
    operador: BOOT.operador, operadores: BOOT.operadores, areas: BOOT.areas, resumo: BOOT.resumo,
    produtosInfo: BOOT.produtos, podeAdministrar: BOOT.pode_administrar,
    tela: 'inicio', pilha: [], ctx: {}, aguardando: null, fila: carregarFila(),
  };
  const TIPOS_AREA = { CONTAINER: 'Container', CAM_CONGELADA: 'Câmara congelada', CAM_REFRIGERADA: 'Câmara refrigerada' };
  const TIPOS_MOV = { ENTRADA: 'Entrada', SAIDA: 'Saída', TRANSFERENCIA: 'Transferência', AJUSTE: 'Ajuste', INVENTARIO: 'Inventário' };

  // ── util ──────────────────────────────────────────────────────────────
  const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const num = (v) => { const n = Number(v); return Number.isInteger(n) ? String(n) : n.toLocaleString('pt-BR', { maximumFractionDigits: 3 }); };
  const dataBr = (iso) => iso ? iso.slice(8, 10) + '/' + iso.slice(5, 7) + '/' + iso.slice(0, 4) : '';
  const horaBr = (ts) => ts ? ts.slice(11, 16) : '';
  const dataHoraBr = (ts) => ts ? dataBr(ts.slice(0, 10)) + ' ' + horaBr(ts) : '';
  const hoje = () => new Date().toISOString().slice(0, 10);
  function uuid() { return (crypto.randomUUID ? crypto.randomUUID() : 'x' + Date.now().toString(16) + Math.random().toString(16).slice(2)); }
  function toast(msg, erro) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.classList.toggle('erro', !!erro); t.classList.add('on');
    clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('on'), erro ? 4500 : 2600);
  }
  async function api(caminho, opts) {
    opts = opts || {};
    const init = { method: opts.method || 'GET', headers: { 'Accept': 'application/json' }, credentials: 'same-origin' };
    if (opts.body !== undefined) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(opts.body); }
    const r = await fetch(API + caminho, init);
    let j = null;
    try { j = await r.json(); } catch (e) { /* html de erro */ }
    if (r.status === 401) { location.href = BASE_PATH + '/login?proximo=' + encodeURIComponent(BASE_PATH + '/wms'); throw new Error('Sessão expirada'); }
    if (!r.ok) { const e = new Error((j && j.erro) || ('Erro ' + r.status)); e.status = r.status; e.dados = j; throw e; }
    return j;
  }
  function badgeValidade(dias, validade) {
    if (!validade) return '<span class="badge badge-neutro">sem validade</span>';
    if (dias < 0) return '<span class="badge badge-erro">vencido há ' + (-dias) + ' d</span>';
    if (dias <= 7) return '<span class="badge badge-erro">vence em ' + dias + ' d</span>';
    if (dias <= 30) return '<span class="badge badge-atencao">vence em ' + dias + ' d</span>';
    return '<span class="badge badge-neutro">val. ' + dataBr(validade) + '</span>';
  }
  function classeValidade(dias, validade) { if (!validade) return ''; if (dias <= 7) return 'venc'; if (dias <= 30) return 'perto'; return ''; }
  function unidadeTexto(p, q) {
    let t = num(q) + ' ' + (p.unidade || 'UN');
    if (p.qtd_por_caixa && p.qtd_por_caixa > 0 && q >= p.qtd_por_caixa) t += ' (' + num(Math.floor(q / p.qtd_por_caixa * 100) / 100) + ' CX)';
    return t;
  }

  // ── navegação ─────────────────────────────────────────────────────────
  function ir(tela, ctx, empilhar) {
    if (empilhar !== false && S.tela !== tela) S.pilha.push({ tela: S.tela, ctx: S.ctx });
    if (S.pilha.length > 12) S.pilha.shift();
    S.tela = tela; S.ctx = ctx || {}; S.aguardando = null;
    document.querySelectorAll('.aba').forEach((a) => a.classList.toggle('on', a.dataset.aba === tela));
    render();
    window.scrollTo(0, 0);
  }
  function voltar() { const p = S.pilha.pop(); if (p) ir(p.tela, p.ctx, false); else ir('inicio', {}, false); }
  document.querySelectorAll('.aba').forEach((a) => a.addEventListener('click', () => ir(a.dataset.aba)));
  document.getElementById('btn-operador').addEventListener('click', () => ir('operador'));

  function atualizarTopo() {
    const b = document.getElementById('btn-operador');
    const nome = document.getElementById('operador-nome');
    if (S.operador) {
      b.classList.remove('vazio');
      b.querySelector('.bola').textContent = S.operador.nome.split(' ').map((x) => x[0]).join('').slice(0, 2).toUpperCase();
      nome.textContent = S.operador.nome.split(' ')[0];
    } else { b.classList.add('vazio'); b.querySelector('.bola').textContent = '?'; nome.textContent = 'ninguém'; }
    const r = document.getElementById('rede');
    r.classList.toggle('off', !navigator.onLine); r.textContent = navigator.onLine ? 'online' : 'offline';
    const f = document.getElementById('faixa-fila');
    f.hidden = S.fila.length === 0;
    document.getElementById('faixa-texto').textContent = S.fila.length + (S.fila.length === 1 ? ' movimento aguardando rede' : ' movimentos aguardando rede');
  }
  window.addEventListener('online', () => { atualizarTopo(); reenviarFila(); });
  window.addEventListener('offline', atualizarTopo);

  // ── render ────────────────────────────────────────────────────────────
  function render() {
    atualizarTopo();
    const fn = TELAS[S.tela] || TELAS.inicio;
    app.innerHTML = fn(S.ctx);
    const pos = TELAS_POS[S.tela]; if (pos) pos(S.ctx);
    const campo = app.querySelector('[data-foco]'); if (campo && !('ontouchstart' in window)) campo.focus();
  }
  const TELAS = {}, TELAS_POS = {};

  // Início
  TELAS.inicio = () => `
    <h1>Início<small>Leia qualquer etiqueta pra começar</small></h1>
    <div class="leitura">
      <input type="text" id="campo-leitura" data-foco inputmode="none" placeholder="Ler ou digitar código" autocomplete="off">
      <button type="button" class="btn-cam" id="btn-cam" title="Ler com a câmera">📷</button>
      <div class="dica">produto (EAN da embalagem ou DUN da caixa) · posição (QR da etiqueta)</div>
    </div>
    <div class="acoes">
      <button class="primario" data-ir="mov" data-tipo="ENTRADA"><b>Entrada</b><span>produto chega na posição</span></button>
      <button data-ir="busca"><b>Consultar</b><span>onde está / o que tem</span></button>
      <button data-ir="mov" data-tipo="TRANSFERENCIA"><b>Mover</b><span>de uma posição a outra</span></button>
      <button data-ir="mov" data-tipo="SAIDA"><b>Saída</b><span>expedição, perda, devolução</span></button>
      <button data-ir="posicoes"><b>Posições</b><span>criar e imprimir etiquetas</span></button>
      <button data-ir="movimentos"><b>Movimentos</b><span>o que foi feito hoje</span></button>
    </div>
    <div class="cartao">
      <div class="rotulo">Hoje</div>
      <div class="valor">${S.resumo.movimentos || 0} movimentos · ${S.resumo.ocupadas || 0} de ${S.resumo.posicoes || 0} posições ocupadas</div>

    const erroEl = g('mov-erro'); erroEl.innerHTML = '';
    const falha = (m) => { erroEl.innerHTML = '<div class="cartao erro"><div class="sub">' + esc(m) + '</div></div>'; toast(m, true); };
    if (!ctx.produto) return falha('Leia ou escolha o produto.');
    if (!S.operador) { toast('Identifique o operador primeiro', true); return ir('operador'); }
    let q = Number(String(g('f-qtd').value).replace(',', '.'));
    if (!(q > 0)) return falha('Informe a quantidade.');
    const unid = g('f-unid'); let obsUnid = '';
    if (unid && unid.value === 'CX') { obsUnid = num(q) + ' CX × ' + num(ctx.produto.qtd_por_caixa); q = q * ctx.produto.qtd_por_caixa; }
    const validade = g('f-validade').value;
    if (ctx.tipo === 'ENTRADA' && ctx.produto.controla_validade && !validade) return falha('Validade é obrigatória pra esse produto.');
    const obs = [g('f-motivo') ? g('f-motivo').value : '', obsUnid, g('f-obs').value].filter(Boolean).join(' · ');
    const mov = {
      uuid: uuid(), tipo: ctx.tipo, produto_id: ctx.produto.id, lote: g('f-lote').value.trim().toUpperCase(), validade: validade || null,
      quantidade: q, origem: g('f-origem') ? g('f-origem').value.trim().toUpperCase() : (ctx.origem || null),
      destino: g('f-destino') ? g('f-destino').value.trim().toUpperCase() : null, observacao: obs,
      criado_em: new Date().toISOString().slice(0, 19).replace('T', ' '), operador: S.operador,
    };
    if (ctx.tipo === 'ENTRADA' && !mov.destino) return falha('Leia a etiqueta da posição de destino.');
    if (ctx.tipo !== 'ENTRADA' && !mov.origem) return falha('Escolha de onde sai o produto.');
    if (ctx.tipo === 'TRANSFERENCIA' && !mov.destino) return falha('Leia a etiqueta da posição de destino.');
    const btn = g('btn-confirmar'); btn.disabled = true;
    try {
      const r = await api('/movimentos', { method: 'POST', body: mov });

      const resumo = Object.keys(s).map((k) => k + ': ' + num(s[k])).join(' · ');
      toast(TIPOS_MOV[ctx.tipo] + ' registrada. ' + resumo);

      if (ctx.tipo === 'SAIDA' || ctx.tipo === 'TRANSFERENCIA') abrirProduto(ctx.produto.id, false); else abrirPosicao(mov.destino, false);
    } catch (e) {
      if (e.status === 409 && e.dados && e.dados.sem_operador) { S.operador = null; toast(e.message, true); ir('operador'); }
      else if (!e.status) { enfileirar(mov); toast('Sem rede: movimento guardado na fila e será enviado quando a internet voltar.'); S.pilha = []; ir('inicio'); }

      if (!alvo && candidatos.length === 1) alvo = candidatos[0];
      if (!alvo) { toast('Esse produto está em mais de uma linha: toque na linha que você está separando e bipe de novo.', true); return; }
      const produto = r.produtos.find((p) => p.id === alvo.produto_id);
      const nosSaldos = (produto.saldos || []).filter((s) => (s.lote || '') === (r.lote || ''));
      let posicao = nosSaldos.length === 1 ? nosSaldos[0].posicao : null;
      if (!posicao) posicao = prompt('Em qual posição você pegou o lote ' + (r.lote || '(sem lote)') + '?', (nosSaldos[0] || {}).posicao || '');
      if (!posicao) return;
      try {
        const resp = await api('/reservas/' + alvo.id + '/trocar-lote', { method: 'POST', body: { posicao: posicao.trim().toUpperCase(), lote: r.lote, validade: r.validade || null } });
        // Bipar o mesmo lote da reserva é confirmação, não troca.
        toast(resp.reserva && resp.reserva.confirmada
          ? 'Lote confirmado: ' + posicao.trim().toUpperCase()
          : 'Lote trocado: ' + posicao.trim().toUpperCase());
        abrirSeparacao(ctx.pedido.id);
      } catch (e) {
        if (e.status === 409 && e.dados && e.dados.sem_operador) { S.operador = null; toast(e.message, true); ir('operador'); }
        else toast(e.message, true);
      }
    }
    // Toque na linha = "é esta que eu estou separando" -- desempata quando o
    // mesmo produto está em mais de uma linha do pedido.
    app.querySelectorAll('[data-res]').forEach((x) => x.addEventListener('click', () => {
      ctx.reservaSel = Number(x.dataset.res);
      app.querySelectorAll('[data-res]').forEach((y) => y.classList.toggle('escolhido', y === x));
    }));
    campo.addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); const v = campo.value.trim(); campo.value = ''; if (v) bipar(v); } });
    document.getElementById('btn-cam-sep').addEventListener('click', () => abrirCamera(bipar));
  };

  // Produto manual
  TELAS.novoProduto = (ctx) => `
    <button class="voltar" id="btn-voltar">‹ Voltar</button>
    <h1>Cadastro rápido<small>produto que não está no catálogo do Stokki ainda</small></h1>
    <div class="cartao atencao"><div class="sub">Fica marcado como <b>manual</b>. Quando o produto aparecer no Stokki, o Hugo concilia.</div></div>
    <div class="campo"><label>EAN (código de barras)</label><input type="text" id="n-ean" inputmode="numeric" value="${esc(ctx.ean || '')}" placeholder="13 dígitos" autocomplete="off"></div>
    <div class="campo"><label>Descrição</label><input type="text" id="n-desc" data-foco placeholder="Nome como está na embalagem" autocomplete="off"></div>
    <div class="campo"><label>Embarcador (dono do produto)</label><input type="text" id="n-emb" placeholder="opcional" autocomplete="off"></div>
    <div class="duas">
      <div class="campo"><label>Unidade</label><select id="n-unid"><option>UN</option><option>CX</option><option>KG</option><option>PC</option></select></div>
      <div class="campo"><label>Unid. por caixa</label><input type="number" id="n-cx" inputmode="numeric" min="0" placeholder="opcional"></div>
    </div>
    <div class="botoes"><button class="botao" id="btn-salvar-prod">Salvar e usar</button></div>`;
  TELAS_POS.novoProduto = () => {
    document.getElementById('btn-voltar').addEventListener('click', voltar);
    document.getElementById('btn-salvar-prod').addEventListener('click', async () => {
      const g = (id) => document.getElementById(id);
      try {
        const r = await api('/produtos/manual', { method: 'POST', body: { ean: g('n-ean').value, descricao: g('n-desc').value, embarcador: g('n-emb').value, unidade: g('n-unid').value, qtd_por_caixa: g('n-cx').value || null } });
        toast('Produto cadastrado'); S.pilha = []; ir('mov', { tipo: 'ENTRADA', produto: r.produto });
      } catch (e) { toast(e.message, true); }
    });
  };

  // ── leitura de códigos ────────────────────────────────────────────────
  async function abrirProduto(id, empilhar) {
    try { const p = await api('/produtos/' + id); ir('produto', { produto: p }, empilhar); } catch (e) { toast(e.message, true); }
  }
  async function abrirPosicao(codigo, empilhar) {
    try { const p = await api('/posicoes/' + encodeURIComponent(codigo)); ir('posicao', { posicao: p }, empilhar); } catch (e) { toast(e.message, true); }
  }
  async function lerCodigo(codigo) {
    codigo = String(codigo || '').trim(); if (!codigo) return;
    let r;
    try { r = await api('/ler?codigo=' + encodeURIComponent(codigo)); } catch (e) { return toast(e.message, true); }
    // dentro de um formulário de movimento, a leitura preenche o campo certo
    if (S.tela === 'mov') {
      if (r.tipo === 'produto') { return escolherProdutoParaMov(r.produtos); }
      if (r.tipo === 'posicao') {
        const fd = document.getElementById('f-destino'); const fo = document.getElementById('f-origem');
        const alvo = (S.ctx.tipo === 'TRANSFERENCIA' && fo && !fo.value) ? fo : fd || fo;
        if (alvo) { alvo.value = r.posicao.codigo; alvo.dispatchEvent(new Event('change')); toast('Posição ' + r.posicao.codigo); }
        return;
      }
    }
    if (S.tela === 'busca' && S.ctx.paraMov && r.tipo === 'produto') return escolherProdutoParaMov(r.produtos);
    if (r.tipo === 'posicao') { const p = await api('/posicoes/' + encodeURIComponent(r.posicao.codigo)); return ir('posicao', { posicao: p }); }
    if (r.tipo === 'produto') {
      if (r.produtos.length === 1) return abrirProduto(r.produtos[0].id).then(() => { S.ctx.produto.lido_como = r.produtos[0].lido_como; render(); });
      return ir('busca', { q: codigo });
    }
    if (r.tipo === 'posicao_inexistente') {
      if (confirm('A posição ' + r.codigo + ' não existe. Criar agora?')) {
        try { const c = await api('/posicoes', { method: 'POST', body: { codigo: r.codigo } }); toast('Posição criada'); abrirPosicao(c.posicao.codigo); } catch (e) { toast(e.message, true); }
      }
      return;
    }
    if (r.tipo === 'desconhecido') {
      if (r.parece_ean) { if (confirm('Código ' + r.codigo + ' não está no catálogo. Cadastrar produto manual?')) ir('novoProduto', { ean: r.codigo }); }
      else ir('busca', { q: codigo });
      return;
    }
    toast(r.erro || 'Código não reconhecido', true);
  }
  function escolherProdutoParaMov(produtos) {
    const aplicar = (p) => {
      const ctx = S.tela === 'mov' ? S.ctx : (S.pilha.length ? S.pilha.pop().ctx : { tipo: 'ENTRADA' });
      ctx.produto = p; ctx.unidadeLida = p.lido_como === 'DUN' ? 'CX' : 'UN';
      ctx.lotes = (ctx.tipo !== 'ENTRADA') ? (p.saldos || []) : []; ctx.loteSel = null;
      if (ctx.origem && ctx.lotes.length) { ctx.lotes = ctx.lotes.filter((l) => l.posicao === ctx.origem); }
      ir('mov', ctx, false); toast(p.descricao);
    };
    if (produtos.length === 1) return aplicar(produtos[0]);
    // mesmo EAN em mais de um embarcador: pergunta
    const escolha = prompt(produtos.map((p, i) => (i + 1) + ') ' + p.descricao + ' — ' + (p.embarcador || '')).join('\n') + '\n\nQual? (número)');
    const p = produtos[Number(escolha) - 1]; if (p) aplicar(p);
  }

  // leitor externo (teclado): junta teclas rápidas e dispara no Enter
  let buf = '', bufT = 0;
  document.addEventListener('keydown', (e) => {
    const alvo = e.target; const tag = alvo && alvo.tagName;
    const emCampo = tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT';
    if (emCampo && !(alvo.id === 'campo-leitura' || alvo.id === 'f-produto')) return;
    if (emCampo) return; // esses campos tratam o próprio Enter
    const agora = Date.now(); if (agora - bufT > 400) buf = ''; bufT = agora;
    if (e.key === 'Enter') { if (buf.length >= 3) { e.preventDefault(); const v = buf; buf = ''; lerCodigo(v); } return; }
    if (e.key.length === 1) buf += e.key;
  });

  // câmera: BarcodeDetector nativo; senão, ZXing carregado sob demanda
  let camStream = null, camLoop = null, zxingReader = null;
  async function abrirCamera(onCodigo) {
    const modal = document.getElementById('modal-cam'); const video = document.getElementById('video'); const st = document.getElementById('cam-status');
    modal.classList.add('on'); st.textContent = 'Abrindo câmera…';
    const fechar = () => { modal.classList.remove('on'); if (camLoop) cancelAnimationFrame(camLoop); camLoop = null; if (zxingReader) { try { zxingReader.reset(); } catch (e) {} } if (camStream) { camStream.getTracks().forEach((t) => t.stop()); camStream = null; } };
    document.getElementById('btn-fechar-cam').onclick = fechar;
    let ultimo = '', ultimoT = 0;
    const achou = (texto) => { const t = Date.now(); if (texto === ultimo && t - ultimoT < 2500) return; ultimo = texto; ultimoT = t; if (navigator.vibrate) navigator.vibrate(60); fechar(); onCodigo(texto); };
    try {
      if ('BarcodeDetector' in window) {
        camStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: 'environment' }, width: { ideal: 1280 }, height: { ideal: 720 } } });
        video.srcObject = camStream; await video.play();
        const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'itf', 'qr_code'] });
        st.textContent = 'Aponte para o código de barras ou QR';
        const tick = async () => { if (!camStream) return; try { const cods = await det.detect(video); if (cods.length && cods[0].rawValue) return achou(cods[0].rawValue); } catch (e) {} camLoop = requestAnimationFrame(tick); };
        tick();
      } else {
        st.textContent = 'Carregando leitor…';
        if (!window.ZXing) await new Promise((res, rej) => { const s = document.createElement('script'); s.src = 'https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
        zxingReader = new ZXing.BrowserMultiFormatReader();
        st.textContent = 'Aponte para o código de barras ou QR';
        zxingReader.decodeFromVideoDevice(undefined, video, (result) => { if (result) achou(result.getText()); });
      }
    } catch (e) { st.textContent = 'Não consegui abrir a câmera: ' + e.message + '. Use o leitor ou digite o código.'; }
  }

  // ── fila offline ──────────────────────────────────────────────────────
  function carregarFila() { try { return JSON.parse(localStorage.getItem('wms_fila') || '[]'); } catch (e) { return []; } }
  function salvarFila() { try { localStorage.setItem('wms_fila', JSON.stringify(S.fila)); } catch (e) {} atualizarTopo(); }
  function enfileirar(mov) { S.fila.push(mov); salvarFila(); }
  let reenviando = false;
  async function reenviarFila() {
    if (reenviando || !S.fila.length || !navigator.onLine) return;
    reenviando = true;
    try {
      const r = await api('/movimentos/lote', { method: 'POST', body: { movimentos: S.fila } });
      const falhas = r.resultados.filter((x) => !x.ok);
      S.fila = S.fila.filter((m) => falhas.some((f) => f.uuid === m.uuid));
      salvarFila();
      if (falhas.length) toast(falhas.length + ' movimento(s) da fila foram recusados: ' + falhas[0].erro, true);
      else toast('Fila enviada.');
      if (S.tela === 'inicio') { try { const b = await api('/bootstrap'); S.resumo = b.resumo; render(); } catch (e) {} }
    } catch (e) {
      if (e.status === 409) { toast('Identifique o operador pra enviar a fila', true); ir('operador'); }
      else if (e.status) { toast('Fila: ' + e.message, true); }
    } finally { reenviando = false; }
  }
  document.getElementById('btn-reenviar').addEventListener('click', reenviarFila);

  // ── PWA ───────────────────────────────────────────────────────────────
  if ('serviceWorker' in navigator) { navigator.serviceWorker.register(BASE_PATH + '/wms/sw.js', { scope: BASE_PATH + '/wms' }).catch(() => {}); }

  // ── início ────────────────────────────────────────────────────────────
  render();
  if (!S.operador) ir('operador', {}, false);
  if (S.fila.length && navigator.onLine) setTimeout(reenviarFila, 1500);
})();
</script>
</body>
