# Evolution API auto-hospedada — FreshLog Atendimento (substitui o Chatwoot,
# 26/08: custo por conversa da Cloud API + verificação de CNPJ travada na
# Meta inviabilizaram continuar por ali. Risco de banimento aceito pelo Hugo).
#
# Sem Caddy aqui dentro: essa VPS já roda Caddy nativo (systemd) na frente
# de outros serviços (app.freshhub.com.br, confirmacao.freshhub.com.br,
# atendimento.freshhub.com.br) -- mas a Evolution API NUNCA é exposta por
# ele: só publica em 127.0.0.1:8080, chamada por loopback pelo app Python
# novo (atendimento/app.py, infra/atendimento-central.service), o mesmo
# jeito que o Chatwoot fazia com o painel_agentes.
#
# Primeira subida (na VPS):
#   docker compose up -d
#   (a Evolution API roda sua própria migração via Prisma automaticamente
#   no start do container -- não tem passo equivalente ao antigo
#   `rails db:chatwoot_prepare` do Chatwoot)
#
# Atualização de versão:
#   trocar a tag da imagem abaixo -> docker compose pull -> docker compose up -d

x-base: &base
  image: evoapicloud/evolution-api:v2.3.7   # org antiga (atendai/evolution-api) migrou pra evoapicloud -- fixar sempre numa tag, nunca :latest (mesma lição do Chatwoot)
  env_file: .env
  restart: always

services:
  evolution:
    <<: *base
    depends_on:
      - postgres
      - redis
    ports:
      - "127.0.0.1:8080:8080"   # só localhost; nunca exposto pelo Caddy
    volumes:
      - evolution_instances:/evolution/instances   # credenciais Baileys da sessão pareada -- sem isso, todo restart pede pareamento de novo

  postgres:
    image: postgres:16-alpine   # não precisa da variante pgvector (Evolution não usa embeddings)
    restart: always
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=evolution
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}

  redis:
    image: redis:alpine
    restart: always
    command: ["sh", "-c", "redis-server --requirepass \"$REDIS_PASSWORD\""]
    env_file: .env
    volumes:
      - redis_data:/data

volumes:
  evolution_instances:
  postgres_data:
  redis_data:
