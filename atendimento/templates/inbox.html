{% extends "base.html" %}
{% block titulo %}Inbox{% endblock %}
{% block estilo_extra %}
<style>
  .shell { display: flex; gap: 16px; height: calc(100vh - 44px - 48px); }
  .coluna-lista {
    flex: 0 0 340px;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .abas { display: flex; flex-wrap: wrap; gap: 4px; padding: 10px; border-bottom: 1px solid var(--borda); }
  .abas button {
    background: none; border: 1px solid var(--borda); border-radius: 100px; font-size: 12px;
    padding: 5px 10px; cursor: pointer; color: var(--texto-suave); font-weight: 600;
  }
  .abas button.ativa { background: var(--primaria); color: #fff; border-color: var(--primaria); }
  .lista-conversas { flex: 1; overflow-y: auto; }
  .card-conversa {
    padding: 12px 14px; border-bottom: 1px solid var(--borda); cursor: pointer;
  }
  .card-conversa:hover { background: var(--superficie-hover); }
  .card-conversa.selecionada { background: rgba(14,165,117,0.10); }
  .card-conversa .linha1 { display: flex; justify-content: space-between; gap: 8px; }
  .card-conversa .nome { font-weight: 700; font-size: 13px; }
  .card-conversa .protocolo { font-size: 11px; color: var(--texto-suave); font-family: monospace; }
  .card-conversa .preview { font-size: 12px; color: var(--texto-suave); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card-conversa .rodape { display: flex; justify-content: space-between; align-items: center; margin-top: 6px; }
  .tag-time { font-size: 10px; background: var(--fundo); color: var(--texto-suave); padding: 2px 7px; border-radius: 100px; }
  .tag-motivo { font-size: 10px; background: rgba(14,165,117,0.12); color: var(--acento); padding: 2px 7px; border-radius: 100px; margin-right: 4px; }
  .btn-assumir {
    font-size: 11px; font-weight: 700; background: var(--acento); color: #fff; border: none;
    padding: 4px 10px; border-radius: 6px; cursor: pointer;
  }
  .vazio { padding: 24px; text-align: center; color: var(--texto-suave); font-size: 13px; }
  .caixa-busca { padding: 10px; border-bottom: 1px solid var(--borda); }
  .caixa-busca input {
    width: 100%; padding: 7px 10px; border: 1px solid var(--borda); border-radius: 7px; font-size: 13px;
  }
  .espera { font-size: 10px; font-weight: 700; color: var(--erro); }
  .badge-resolvida { font-size: 10px; background: var(--fundo); color: var(--texto-suave); padding: 2px 7px; border-radius: 100px; }
  .editar-nome { background: none; border: none; cursor: pointer; color: var(--texto-suave); font-size: 12px; padding: 0 0 0 4px; }
  .editar-nome:hover { color: var(--texto); }
  .info-resolvida { padding: 10px 16px; font-size: 12px; color: var(--texto-suave); background: var(--fundo); border-bottom: 1px solid var(--borda); }

  .coluna-thread {
    flex: 1;
    background: var(--superficie);
    border: 1px solid var(--borda);
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .thread-cabecalho {
    padding: 12px 16px; border-bottom: 1px solid var(--borda);
    display: flex; justify-content: space-between; align-items: center; gap: 12px;
  }
  .thread-cabecalho .info .nome { font-weight: 700; font-size: 14px; }
  .thread-cabecalho .info .telefone { font-size: 12px; color: var(--texto-suave); font-family: monospace; }
  .thread-cabecalho .acoes { display: flex; gap: 8px; align-items: center; }
  .thread-cabecalho select { font-size: 12px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--borda); }
  .thread-mensagens { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .bolha { max-width: 65%; padding: 8px 12px; border-radius: 12px; font-size: 13px; line-height: 1.4; }
  .bolha.IN { align-self: flex-start; background: var(--fundo); }
  .bolha.OUT { align-self: flex-end; background: rgba(14,165,117,0.15); }
  .bolha.NOTA { align-self: center; max-width: 85%; background: #FDF3D6; border: 1px dashed #D9B857; color: #6B5416; font-size: 12px; }
  .bolha .meta { font-size: 10px; color: var(--texto-suave); margin-top: 4px; }
  .status-envio { margin-left: 6px; }
  .status-envio.pendente { color: var(--texto-suave); }
  .status-envio.falhou { color: var(--erro); font-weight: 600; }
  .midia-imagem, .midia-video { max-width: 220px; border-radius: 8px; display: block; margin-bottom: 4px; }
  .midia-audio { width: 100%; margin-bottom: 4px; }
  .midia-documento { display: block; margin-bottom: 4px; text-decoration: underline; color: inherit; }
  .thread-resposta { padding: 12px 16px; border-top: 1px solid var(--borda); display: flex; gap: 8px; position: relative; }
  .thread-resposta textarea { min-height: 40px; }
  .picker-respostas { position: relative; }
  .lista-respostas-rapidas {
    display: none; position: absolute; bottom: 100%; left: 0; margin-bottom: 6px; width: 320px; max-height: 260px;
    overflow-y: auto; background: var(--superficie); border: 1px solid var(--borda); border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.15); z-index: 5;
  }
  .lista-respostas-rapidas.aberta { display: block; }
  .lista-respostas-rapidas .item { padding: 8px 12px; cursor: pointer; font-size: 12px; border-bottom: 1px solid var(--borda); }
  .lista-respostas-rapidas .item:last-child { border-bottom: none; }
  .lista-respostas-rapidas .item:hover { background: var(--superficie-hover); }
  .lista-respostas-rapidas .item .titulo { font-weight: 700; }
  .lista-respostas-rapidas .item .preview { color: var(--texto-suave); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .lista-respostas-rapidas .vazio { padding: 10px 12px; font-size: 12px; color: var(--texto-suave); }
  .thread-resposta textarea {
    flex: 1; resize: none; border: 1px solid var(--borda); border-radius: 8px; padding: 8px 10px;
    font-size: 13px; font-family: inherit; height: 40px;
  }
  .sem-selecao { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--texto-suave); }
</style>
{% endblock %}
{% block conteudo %}
<div class="shell">
  <div class="coluna-lista">
    <div class="caixa-busca">
      <input type="text" id="busca-conversas" placeholder="Buscar por nome, telefone ou protocolo...">
    </div>
    <div class="abas" id="abas-filtro">
      <button data-filtro="fila" class="ativa">Não atribuídas</button>
      <button data-filtro="minhas">Minha fila</button>
      {% for t in times %}
      <button data-filtro="time:{{ t }}">{{ t.replace('_', '/').title() }}</button>
      {% endfor %}
      <button data-filtro="todas">Todas</button>
      <button data-filtro="resolvidas">Resolvidas</button>
    </div>
    <div class="lista-conversas" id="lista-conversas"></div>
  </div>
  <div class="coluna-thread" id="coluna-thread">
    <div class="sem-selecao">Selecione uma conversa à esquerda.</div>
  </div>
</div>

<script>
const TIMES = {{ times | tojson }};
const ROTULOS_MOTIVO = {
  status_pedido: "Status do pedido", canhoto: "Canhoto/comprovante",
  cotacao: "Cotação de frete", outro: "Outro assunto",
};
let filtroAtual = "fila";
let buscaAtual = "";
let conversaSelecionadaId = null;

function tempoDecorrido(dataHoraStr) {
  if (!dataHoraStr) return "";
  const inicio = new Date(dataHoraStr.replace(" ", "T"));
  const minutos = Math.max(0, Math.round((Date.now() - inicio.getTime()) / 60000));
  if (minutos < 1) return "agora";
  if (minutos < 60) return `há ${minutos} min`;
  const horas = Math.floor(minutos / 60);
  if (horas < 24) return `há ${horas}h${minutos % 60 ? (minutos % 60) + 'min' : ''}`;
  return `há ${Math.floor(horas / 24)}d`;
}

function fetchJson(url, opcoes) {
  return fetch(BASE_PATH + url, opcoes).then(async r => {
    const dados = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(dados.erro || ("Erro " + r.status));
    return dados;
  });
}

function escapeHtml(s) {
  return (s || "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}

function renderizarLista(conversas) {
  const alvo = document.getElementById("lista-conversas");
  if (!conversas.length) {
    alvo.innerHTML = '<div class="vazio">Nenhuma conversa aqui.</div>';
    return;
  }
  alvo.innerHTML = conversas.map(c => `
    <div class="card-conversa ${c.id === conversaSelecionadaId ? 'selecionada' : ''}" data-id="${c.id}">
      <div class="linha1">
        <span class="nome">${escapeHtml(c.contato_nome || c.contato_telefone)}</span>
        <span class="protocolo">${c.protocolo || ''}</span>
      </div>
      <div class="preview">${escapeHtml(c.ultima_mensagem_preview || '')}</div>
      <div class="rodape">
        <span class="tag-time">
          ${c.motivo_contato ? `<span class="tag-motivo">${ROTULOS_MOTIVO[c.motivo_contato] || c.motivo_contato}</span>` : ''}
          ${c.status === 'RESOLVIDA' ? '<span class="badge-resolvida">resolvida</span>' : (c.time ? c.time.replace('_', '/') : (c.atendente_nome ? c.atendente_nome : 'sem time'))}
          ${filtroAtual === 'fila' && !buscaAtual ? `<span class="espera">${tempoDecorrido(c.aberta_em)}</span>` : ''}
        </span>
        ${!c.atendente_id && c.status === 'ABERTA' ? `<button class="btn-assumir" data-id="${c.id}">Assumir</button>` : ''}
      </div>
    </div>
  `).join("");
}

function carregarConversas() {
  const params = buscaAtual
    ? `busca=${encodeURIComponent(buscaAtual)}`
    : `filtro=${encodeURIComponent(filtroAtual)}`;
  fetchJson(`/api/conversas?${params}`)
    .then(d => renderizarLista(d.conversas))
    .catch(() => {});
}

function selecionarConversa(id) {
  conversaSelecionadaId = id;
  document.getElementById("coluna-thread").innerHTML = '<div class="sem-selecao">Carregando...</div>';
  carregarThread(true);
}

function conteudoMidiaHtml(m) {
  if (!m.midia_categoria) return '';
  const url = `${BASE_PATH}/midia/${m.id}`;
  if (m.midia_categoria === 'imagem') return `<img src="${url}" class="midia-imagem" loading="lazy">`;
  if (m.midia_categoria === 'video') return `<video src="${url}" class="midia-video" controls></video>`;
  if (m.midia_categoria === 'audio') return `<audio src="${url}" class="midia-audio" controls></audio>`;
  const nome = escapeHtml(m.midia_nome_original || (m.midia_categoria === 'figurinha' ? 'figurinha' : 'documento'));
  return `<a href="${url}" target="_blank" rel="noopener" class="midia-documento">📎 ${nome}</a>`;
}

function bolhaHtml(m) {
  const hora = (m.criado_em || '').slice(11, 16);
  const quem = m.direcao === 'OUT' ? (m.atendente_nome || 'Você/celular') : '';
  const statusEnvio = m.status === 'PENDENTE' ? '<span class="status-envio pendente">⏳ reenviando…</span>'
    : m.status === 'FALHOU' ? '<span class="status-envio falhou">⚠️ não entregue</span>' : '';
  return `<div class="bolha ${m.direcao}">
    ${conteudoMidiaHtml(m)}
    ${escapeHtml(m.corpo || '')}
    <div class="meta">${quem ? escapeHtml(quem) + ' · ' : ''}${hora}${statusEnvio}</div>
  </div>`;
}

function notaHtml(n) {
  const hora = (n.criado_em || '').slice(11, 16);
  return `<div class="bolha NOTA">
    📌 Nota de ${escapeHtml(n.atendente_nome || 'atendente')}: ${escapeHtml(n.corpo || '')}
    <div class="meta">${hora}</div>
  </div>`;
}

function mesclarOrdenado(mensagens, notas) {
  const itens = mensagens.map(m => ({dados: m, tipo: 'MSG', quando: m.criado_em || ''}))
    .concat((notas || []).map(n => ({dados: n, tipo: 'NOTA', quando: n.criado_em || ''})));
  itens.sort((a, b) => a.quando.localeCompare(b.quando));
  return itens;
}

function montarCabecalho(conversa) {
  const opcoesTime = ['<option value="">sem time</option>']
    .concat(TIMES.map(t => `<option value="${t}" ${conversa.time === t ? 'selected' : ''}>${t.replace('_', '/')}</option>`));
  const resolvida = conversa.status === 'RESOLVIDA';
  const acoes = resolvida
    ? `<span class="badge-resolvida">Resolvida ${conversa.encerrada_em ? 'em ' + conversa.encerrada_em.slice(0, 16) : ''}</span>
       <button class="botao" id="btn-reabrir">Reabrir</button>`
    : `<select id="select-time">${opcoesTime.join('')}</select>
       ${!conversa.atendente_id ? `<button class="botao" id="btn-assumir-thread">Assumir</button>` : ''}
       <button class="botao perigo" id="btn-encerrar">Encerrar</button>`;
  return `
    <div class="thread-cabecalho">
      <div class="info">
        <div class="nome">${escapeHtml(conversa.contato_nome || conversa.contato_telefone)}
          <button type="button" class="editar-nome" id="btn-editar-nome" title="Editar nome do contato">✎</button>
        </div>
        <div class="telefone">${escapeHtml(conversa.contato_telefone)} · ${conversa.protocolo || ''}
          ${conversa.motivo_contato ? `<span class="tag-motivo">${ROTULOS_MOTIVO[conversa.motivo_contato] || conversa.motivo_contato}</span>` : ''}
        </div>
      </div>
      <div class="acoes">${acoes}</div>
    </div>
    <div class="thread-mensagens" id="thread-mensagens"></div>
    ${resolvida ? `<div class="info-resolvida">Conversa encerrada — somente leitura.</div>` : `
    <div class="thread-resposta">
      <div class="picker-respostas">
        <button type="button" class="botao" id="btn-respostas-rapidas" title="Respostas rápidas">📋</button>
        <div class="lista-respostas-rapidas" id="lista-respostas-rapidas"></div>
      </div>
      <button type="button" class="botao" id="btn-nota" title="Nota interna (não vai pro cliente)">📌</button>
      <textarea id="texto-resposta" placeholder="Escreva uma resposta..."></textarea>
      <button class="botao" id="btn-enviar">Enviar</button>
    </div>`}
  `;
}

function carregarThread(primeiraVez) {
  if (conversaSelecionadaId === null) return;
  fetchJson(`/api/conversas/${conversaSelecionadaId}/mensagens`).then(d => {
    const coluna = document.getElementById("coluna-thread");
    if (primeiraVez) {
      coluna.innerHTML = montarCabecalho(d.conversa);
      document.getElementById("btn-editar-nome").addEventListener("click", () => {
        const novoNome = prompt("Nome do contato:", d.conversa.contato_nome || "");
        if (!novoNome || !novoNome.trim()) return;
        fetchJson(`/api/contatos/${d.conversa.contato_id}/nome`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({nome: novoNome.trim()}),
        }).then(() => { carregarThread(true); carregarConversas(); }).catch(err => alert(err.message));
      });
      const selectTime = document.getElementById("select-time");
      if (selectTime) selectTime.addEventListener("change", e => {
        fetchJson(`/api/conversas/${conversaSelecionadaId}/time`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({time: e.target.value || null}),
        }).catch(err => alert(err.message));
      });
      const btnAssumir = document.getElementById("btn-assumir-thread");
      if (btnAssumir) btnAssumir.addEventListener("click", () => assumir(conversaSelecionadaId));
      const btnEncerrar = document.getElementById("btn-encerrar");
      if (btnEncerrar) btnEncerrar.addEventListener("click", () => {
        if (!confirm("Encerrar esta conversa?")) return;
        fetchJson(`/api/conversas/${conversaSelecionadaId}/encerrar`, {method: "POST"})
          .then(() => { conversaSelecionadaId = null; document.getElementById("coluna-thread").innerHTML = '<div class="sem-selecao">Selecione uma conversa à esquerda.</div>'; carregarConversas(); })
          .catch(err => alert(err.message));
      });
      const btnReabrir = document.getElementById("btn-reabrir");
      if (btnReabrir) btnReabrir.addEventListener("click", () => {
        fetchJson(`/api/conversas/${conversaSelecionadaId}/reabrir`, {method: "POST"})
          .then(() => { carregarThread(true); carregarConversas(); })
          .catch(err => alert(err.message));
      });
      const btnNota = document.getElementById("btn-nota");
      if (btnNota) btnNota.addEventListener("click", () => {
        const texto = prompt("Nota interna (não é enviada ao cliente):");
        if (!texto || !texto.trim()) return;
        fetchJson(`/api/conversas/${conversaSelecionadaId}/notas`, {
          method: "POST", headers: {"Content-Type": "application/json"},
          body: JSON.stringify({corpo: texto.trim()}),
        }).then(() => carregarThread(false)).catch(err => alert(err.message));
      });
      const btnRespostasRapidas = document.getElementById("btn-respostas-rapidas");
      if (btnRespostasRapidas) btnRespostasRapidas.addEventListener("click", () => {
        const lista = document.getElementById("lista-respostas-rapidas");
        const abrir = !lista.classList.contains("aberta");
        lista.classList.toggle("aberta", abrir);
        if (abrir) carregarRespostasRapidas();
      });
      const btnEnviar = document.getElementById("btn-enviar");
      if (btnEnviar) btnEnviar.addEventListener("click", enviarResposta);
      const campoResposta = document.getElementById("texto-resposta");
      if (campoResposta) campoResposta.addEventListener("keydown", e => {
        if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); enviarResposta(); }
      });
    }
    const alvo = document.getElementById("thread-mensagens");
    const estavaNoFim = primeiraVez || (alvo.scrollHeight - alvo.scrollTop - alvo.clientHeight < 40);
    const itens = mesclarOrdenado(d.mensagens, d.notas);
    alvo.innerHTML = itens.map(it => it.tipo === 'NOTA' ? notaHtml(it.dados) : bolhaHtml(it.dados)).join("");
    if (estavaNoFim) alvo.scrollTop = alvo.scrollHeight;
  }).catch(() => {});
}

function carregarRespostasRapidas() {
  const lista = document.getElementById("lista-respostas-rapidas");
  if (!lista) return;
  lista.innerHTML = '<div class="vazio">Carregando...</div>';
  fetchJson("/api/respostas-rapidas").then(d => {
    if (!d.respostas.length) {
      lista.innerHTML = '<div class="vazio">Nenhuma resposta rápida cadastrada (crie em "Respostas rápidas" no menu).</div>';
      return;
    }
    lista.innerHTML = d.respostas.map(r => `
      <div class="item" data-corpo="${escapeHtml(r.corpo)}">
        <div class="titulo">${escapeHtml(r.titulo)}</div>
        <div class="preview">${escapeHtml(r.corpo)}</div>
      </div>
    `).join("");
    lista.querySelectorAll(".item").forEach(el => el.addEventListener("click", () => {
      const campo = document.getElementById("texto-resposta");
      campo.value = campo.value ? campo.value + "\n" + el.dataset.corpo : el.dataset.corpo;
      lista.classList.remove("aberta");
      campo.focus();
    }));
  }).catch(() => { lista.innerHTML = '<div class="vazio">Falha ao carregar.</div>'; });
}

function enviarResposta() {
  const campo = document.getElementById("texto-resposta");
  const texto = campo.value.trim();
  if (!texto) return;
  campo.disabled = true;
  fetchJson(`/api/conversas/${conversaSelecionadaId}/responder`, {
    method: "POST", headers: {"Content-Type": "application/json"},
    body: JSON.stringify({texto}),
  }).then(() => {
    campo.value = "";
    carregarThread(false);
  }).catch(err => alert(err.message)).finally(() => { campo.disabled = false; campo.focus(); });
}

function assumir(id) {
  fetchJson(`/api/conversas/${id}/assumir`, {method: "POST"})
    .then(() => { carregarConversas(); if (conversaSelecionadaId === id) carregarThread(true); })
    .catch(err => alert(err.message));
}

document.getElementById("abas-filtro").addEventListener("click", e => {
  const botao = e.target.closest("button[data-filtro]");
  if (!botao) return;
  filtroAtual = botao.dataset.filtro;
  document.querySelectorAll("#abas-filtro button").forEach(b => b.classList.toggle("ativa", b === botao));
  carregarConversas();
});

let temporizadorBusca = null;
document.getElementById("busca-conversas").addEventListener("input", e => {
  clearTimeout(temporizadorBusca);
  const valor = e.target.value.trim();
  temporizadorBusca = setTimeout(() => {
    buscaAtual = valor;
    document.getElementById("abas-filtro").style.opacity = buscaAtual ? "0.4" : "1";
    carregarConversas();
  }, 300);
});

document.getElementById("lista-conversas").addEventListener("click", e => {
  const btnAssumir = e.target.closest(".btn-assumir");
  if (btnAssumir) { assumir(parseInt(btnAssumir.dataset.id, 10)); return; }
  const card = e.target.closest(".card-conversa");
  if (card) selecionarConversa(parseInt(card.dataset.id, 10));
});

carregarConversas();
setInterval(carregarConversas, 4000);
setInterval(() => carregarThread(false), 3000);
</script>
{% endblock %}
